<script id="build-data" type="application/json">{"meta": {"game": "poe2", "slug": "poe2-varashta-djinn-levelling", "title": "Varashta Djinn Commander Sorceress", "class": "Sorceress", "ascendancy": "Disciple of Varashta", "objective": "Levelling plus early maps", "league": "Forbidden Rites", "patch": "0.5.5", "verified_on": "2026-11-26", "summary": "A Sorceress who levels on chaos damage over time ({g:Contagion} and {g:Essence Drain}), switches to {g:Bonestorm} at level 14, and from the first Ascendancy trial commands Djinn: Kelari's Brutality and {k:Kelari's Deception} for single targets, Ruzhan's Trap for clearing. Written for patch 0.5.5; patch 1.0 arrives on 11 December, so re-check it then.", "assumptions": ["PoE 2, PC with controller, softcore trade. Elemental resistances capped at 75% at all times.", "Patch 0.5.5 made no skill gem, ascendancy or passive tree changes, so the 0.5 Djinn guides still apply.", "Not playtested. Levels shown for campaign events are estimates; follow the event, not the number."], "planner_url": "https://mobalytics.gg/poe-2/builds/definitiv-guide-to-varashta-sorceress-the-perfect-allrounder", "max_level": 100}, "ratings": [{"vector": "League Start", "grade": "A", "why": "One source rates it 5 out of 5 for league start. Cheap rare gear carries the early game and nothing needs a unique."}, {"vector": "Clear Speed", "grade": "C", "why": "The same source rates clear speed 5 out of 10. Early clear comes from {g:Essence Drain} and {g:Bonestorm}; Djinn clear starts at the first Ascendancy trial."}, {"vector": "Bossing", "grade": "A", "why": "{k:Kelari's Deception} cast three times on one spot, with Kelari's Brutality first, is the single-target nuke. The rotation is seven inputs long."}, {"vector": "Survivability", "grade": "B", "why": "The Djinn are invulnerable and fight for you, and the sources lean on Energy Shield. This is the author's judgement; it is not tested in game."}], "overview": {"why": ["Kelari, Ruzhan and Navira are invulnerable Djinn minions that act only when you Command them. Their commands are your main skills.", "{k:Kelari's Deception} deals Spell damage in a blast and leaves a follow-up; Kelari's Brutality applies Critical Weakness to bosses, which helps every minion.", "{k:Archon of Undeath} gives a chance to gain an Archon buff whenever you use a Command skill."], "strengths": ["Chaos damage over time and {g:Bonestorm} carry the whole campaign before the first Ascendancy trial.", "The Djinn cannot be killed, so the build mostly has to keep itself alive.", "Strong single-target damage once Kelari is out."], "weaknesses": ["Not a one-button build: the boss rotation is seven inputs.", "Clear speed is average until Ruzhan's Trap and the minion supports are in.", "Weak before the first Ascendancy trial: the Djinn only arrive then.", "Passives that do not touch the Djinn are poor value early."]}, "progression": [{"level": 1, "type": "gem", "title": "Start with {g:Spark}", "detail": "Spark is a Tier 1 Uncut Skill Gem from the starting zone. It carries you for the first few levels."}, {"level": 3, "type": "gem", "title": "Cut {g:Contagion} and {g:Frost Bomb}", "detail": "Both are Tier 1. Use Contagion, then Spark, until level 6. Frost Bomb lowers elemental resistance for later fights."}, {"level": 6, "type": "gem", "title": "Cut {g:Essence Drain} (Tier 3) and drop {g:Spark}", "detail": "Link {g:Chain I} and {g:Swift Affliction I}. Swift Affliction needs a little Dexterity. Essence Drain only does real damage once your staff has a chaos or spell damage prefix (see the weapon note at level 1). Without one, {g:Volcano} is the alternative, but it needs Strength."}, {"level": 8, "type": "quest", "title": "Freythorn: kill the King in the Mists for 30 Spirit", "detail": "Spend it on {g:Arctic Armour}, the Tier 4 Spirit gem, until you need the Spirit for the Djinn."}, {"level": 14, "type": "gem", "title": "Cut {g:Bonestorm} (Tier 5) and level it to gem level 5", "detail": "Link {g:Zenith I}, {g:Concentrated Area} and {g:Living Lightning}. Gem level 5 needs character level 14."}, {"level": 21, "type": "ascendancy", "title": "Trial of the Sekhemas: first 2 Ascendancy points", "detail": "Take {k:Kelari's Deception}. The path includes Barya of Kelari, which grants Kelari himself, so this is the whole first pair."}, {"level": 42, "type": "ascendancy", "title": "Act 3 trial: points 3 and 4", "detail": "Take {k:Ruzhan's Trap} (Barya of Ruzhan comes with it). Sources name the Act 3 trial differently, so confirm at the trial."}, {"level": 50, "type": "gear", "title": "Commit to Djinn and minions", "detail": "Fill every minion socket with {g:Muster}, put {g:Bidding I} on the Djinn and add {g:Blindside} once your minions apply Blind."}, {"level": 60, "type": "ascendancy", "title": "Endgame trial: points 5 and 6", "detail": "Take {k:The Fourth Teaching}: shorter Energy Shield recharge delay and faster recharge on low Energy Shield."}, {"level": 75, "type": "ascendancy", "title": "Final trial: points 7 and 8", "detail": "{k:Sacred Rituals} adds 60% of your current Energy Shield to your Armour for physical damage reduction, and costs exactly the last two points."}], "tree": {"nodes": [{"id": "start", "name": "Sorceress", "kind": "start", "x": 50, "y": 8, "level": 1, "points": 0, "note": "Weapon set passive points and normal passive points are both spent from here. The route map below is drawn from the 0.5 passive tree data."}, {"id": "n8397", "name": "Empowering Remains", "kind": "notable", "x": 14, "y": 16.0, "level": 10, "points": 10, "note": "40% increased Spell Damage if one of your Minions has died Recently"}, {"id": "n35560", "name": "At your Command", "kind": "notable", "x": 22, "y": 19.2, "level": 16, "points": 19, "note": "Minions deal 10% increased Damage with Command Skills for each different type of Persistent Minion in your Presence"}, {"id": "n26926", "name": "Archon of Undeath", "kind": "notable", "x": 30, "y": 22.4, "level": 24, "points": 31, "note": "1 target": "75% each", "detail": "Campaign shrines give 10% cold, 10% lightning and 10% fire. Buy the rest on gear."}, {"name": "Energy Shield and recharge", "target": "Build up", "detail": "The Fourth Teaching shortens the recharge delay and speeds recharge on low Energy Shield; Sacred Rituals turns Energy Shield into physical damage reduction."}, {"name": "Invulnerable Djinn", "target": "Command them", "detail": "Kelari, Ruzhan and Navira cannot be killed. They act only when commanded."}], "next_stats": ["Plus levels to skills", "Spirit", "Resistances", "Maximum life and Energy Shield"], "weaknesses": ["Seven-input boss rotation.", "Weak before the first Ascendancy trial.", "Energy Shield plan is untested in this guide."], "avoid_mods": ["Attack damage mods on the staff (you cast and command)", "High Strength or Dexterity requirement bases"]}, "playstyle": {"mapping": [{"step": "1. Frost Bomb", "detail": "Drops resistance on the pack."}, {"step": "2. Ruzhan's Trap", "detail": "Command Ruzhan to hurl his sword at the pack."}, {"step": "3. Essence Drain and Bonestorm", "detail": "Keep your own damage running while the Djinn cooldowns recover."}], "bossing": [{"step": "Precast", "detail": "Elemental Weakness, Frost Bomb and Pain Offering on the boss."}, {"step": "Rotation", "detail": "Kelari's Brutality twice, Kelari's Deception three times on the same spot, then Ruzhan's Trap."}], "positioning": ["Stay at range and keep moving between commands.", "Djinn cooldowns are the limit: spend them on bosses, not trash."], "tips": ["Do the quest rewards. They are a large part of your defence.", "Check the level-by-level table in the Leveling tab for each act's gem and support swaps."]}, "sources": [{"title": "Definitiv Guide to Varashta Sorceress", "url": "https://mobalytics.gg/poe-2/builds/definitiv-guide-to-varashta-sorceress-the-perfect-allrounder", "site": "Mobalytics", "note": "Levelling skills by level, gem supports, gear priorities, Spirit rewards. Updated 16 September 2026."}, {"title": "Djinns of Varashta Build Guide", "url": "https://exile.codex-wiki.com/builds/one-of-the-best-league-starters-got-massive-buffs-for-poe-2", "site": "Exile Codex", "note": "Fan summary of a 0.5 video: league-start rating, Djinn rotation, early skills."}, {"title": "PhazePlays Disciple of Varashta Campaign Leveling Guide", "url": "https://mobalytics.gg/poe-2/profile/phazeplays/builds/0-4-phazeplays-sandscorcher-campaign-guide", "site": "Mobalytics", "note": "Alternative early skills and Djinn timing."}, {"title": "Disciple of Varashta ascendancy", "url": "https://poe2db.tw/us/Disciple_of_Varashta", "site": "poe2db", "note": "Ascendancy node texts. Costs and connections come from the passive tree data instead."}, {"title": "Patch 0.5.5 notes", "url": "https://allthings.how/path-of-exile-2-0-5-5-patch-notes-trial-of-chaos-rework-and-forbidden-rites-event/", "site": "allthings.how", "note": "No skill gem, ascendancy or passive tree changes."}, {"title": "PoE 2 Ascendancy Points", "url": "https://timesaver.gg/tools/poe-2/ascendancy/points", "site": "timesaver.gg", "note": "Which trials give points 2, 4, 6 and 8. Covers patch 0.5.4b only."}, {"title": "PoE 2 league calendar", "url": "https://whenispoe2.com/calendar", "site": "whenispoe2", "note": "Forbidden Rites live; 1.0 on 11 December 2026."}], "confidence_notes": ["Weapon: the sources suggest a scepter. The game data shows a scepter cannot roll chaos damage, spell damage or plus-levels to spell skills, so this guide keeps a staff. Staff affix ranges come from the PoE 2 game data (Path of Building 2 export); whether the Spell Damage prefix also scales Essence Drain's damage-over-time effect has not been checked in game.", "Not playtested. This guide was written from three published Djinn guides and the game data, and has not been tried in game.", "The early skills disagree between guides: one uses Essence Drain with Contagion and Skeletal Sniper with Flame Wall, another Spark, Contagion and Frost Bomb, then Essence Drain at level 6 or Volcano. This guide takes the second, because its gems and levels are stated. Skeletal Sniper and Flame Wall are not used.", "The Djinn skills come from Ascendancy nodes. Which Djinn command is best at which level, the seven-input boss rotation and the Muster, Bidding and Blindside supports come from two fan guides and are not checked in game. The sources do not say which tier of Bidding to use; this guide uses Bidding I.", "Patch 1.0 and the Conquerors of Wraeclast league start on 11 December 2026. Its notes were not out when this was written; re-check every gem, node and level.", "The passive tree route is drawn from the Path of Building 2 tree data (a game-data export, not a screenshot of the in-game tree). Only Empowering Remains and Archon of Undeath come from a guide; Pure Chaos (11% of damage as extra Chaos Damage) and At your Command (minion damage with Command skills) were chosen by this guide. The data also holds 200 'planned' nodes that the live game does not show, for example Night's Bite and Mentorship; this route leaves them out. Nodes can still differ between the data and your live tree, so search for each notable in the in-game search box before you rely on the order. The Ascendancy costs are computed from the same data: Kelari's Deception costs 2 points, Ruzhan's Trap 2 more, The Fourth Teaching 2 more and Sacred Rituals the last 2.", "Character levels for campaign events are estimates. The guides give no per-act level ranges. The reliable anchors are the gem-level to character-level table (5 at 14, 10 at 36, 15 at 64, 20 at 90) and the Spirit and ascendancy point rewards. The first Ascendancy trial is placed at about level 21.", "Spirit rewards (30 at Freythorn, 30 at Azak Bog, 40 at Kriar Village) and the +2 passive point quests are from one guide. The Spirit cost of each Djinn is not in the game data used here.", "The Ever-Grasping Ring and Silks of Veneration are named by the sources but are not used: the first is not in the game data used here and the second lists mods from two patches. Confirm both in game before buying.", "Tooltips and the loot filter are generated from the PoE 2 game data (Path of Building 2 export), not scraped from poe2db, which is not reachable from the build shell. The filter's currency tiers, Waystone tiers and item level 82 are choices, not verified facts."], "level_guide": [{"level": 1, "gems": ["Start with {g:Spark}."], "gear": ["Use whatever weapon you find until level 6. From then on, pick up any two-handed {r:Staff} with an increased Chaos Damage or Spell Damage prefix; the base type does not matter."], "detour": ["Take every '+2 Skill Points' quest reward as you pass it."]}, {"level": 3, "gems": ["Cut {g:Contagion} and {g:Frost Bomb} from the first Tier 1 gems. Use Contagion, then Spark, until level 6."], "gear": [], "detour": []}, {"level": 6, "gems": ["Cut {g:Essence Drain} (Tier 3). Link {g:Chain I} and {g:Swift Affliction I}. Drop {g:Spark}."], "gear": ["Your staff must have a Chaos Damage or Spell Damage prefix now. A plain staff adds no damage. If you cannot find or buy one, use {g:Volcano} instead."], "detour": []}, {"level": 8, "gems": ["Freythorn: kill the King in the Mists for 30 Spirit, then use {g:Arctic Armour}."], "gear": ["Upgrade flasks around level 4 and 10."], "detour": []}, {"level": 14, "gems": ["Cut {g:Bonestorm} (Tier 5) and link {g:Zenith I}, {g:Concentrated Area} and {g:Living Lightning} as you find them."], "gear": ["Wear a {r:Feathered Robe}, {r:Iron Crown} and {r:Padded Leggings} (magic is fine)."], "detour": ["Candlemass in Oghman Manor gives +20 life."]}, {"level": 21, "gems": [], "gear": ["Keep your staff. A sceptre cannot roll damage or spell levels, so do not swap to one for damage."], "detour": ["TRIAL OF THE SEKHEMAS: Ascendancy points 1 and 2. Take {k:Kelari's Deception}."]}, {"level": 22, "gems": ["Use the Kelari commands in your rotation."], "gear": ["Start the Energy Shield stage: {r:Silk Robe} (level 22), {r:Jewelled Gloves} at 26, {r:Silk Slippers} at 27 and {r:Beaded Circlet}. Check your Intelligence first."], "detour": []}, {"level": 36, "gems": ["Level your skills to gem level 10."], "gear": [], "detour": []}, {"level": 40, "gems": ["Azak Bog: kill Ignagduk for 30 more Spirit (60 total) and an Uncut Spirit Gem."], "gear": [], "detour": []}, {"level": 42, "gems": [], "gear": [], "detour": ["ACT 3 TRIAL: Ascendancy points 3 and 4. Take {k:Ruzhan's Trap}."]}, {"level": 50, "gems": ["Fill every minion socket with {g:Muster}. Put {g:Bidding I} on the Djinn and add {g:Blindside} once your minions apply Blind."], "gear": [], "detour": []}, {"level": 55, "gems": ["Interlude 2: Lythara in Kriar Village gives 40 Spirit (100 total)."], "gear": [], "detour": []}, {"level": 60, "gems": [], "gear": [], "detour": ["ENDGAME TRIAL (level 60+): Ascendancy points 5 and 6. Take {k:The Fourth Teaching}."]}, {"level": 64, "gems": ["Level your skills to gem level 15."], "gear": [], "detour": []}, {"level": 75, "gems": [], "gear": [], "detour": ["FINAL TRIAL (level 75+): Ascendancy points 7 and 8. Take {k:Sacred Rituals}."]}]}</script>
<script>
(function(){
"use strict";
var B=JSON.parse(document.getElementById("build-data").textContent);
var M=B.meta||{}, MAX=M.max_level||100, KEY="wa:"+(M.slug||M.title||"build");
var S={level:1,done:{},nodes:{},stage:null,slot:null,node:null,wset:1,future:true};
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null"); if(sv){S.level=sv.level||1;S.done=sv.done||{};S.nodes=sv.nodes||{};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({level:S.level,done:S.done,nodes:S.nodes}));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
/* {g:Gem} {u:Unique} {r:Rare} {m:Magic} {k:Keystone/Notable} {c:Currency} */
function fmt(s){return esc(s).replace(/\{([gurmkc]):([^}]+)\}/g,'<span class="t-$1">$2</span>');}
function list(a,cls){return a&&a.length?'<ul class="plain '+(cls||"")+'">'+a.map(function(x){return"<li>"+fmt(x)+"</li>";}).join("")+"</ul>":"";}
function box(title,inner){return inner?'<section class="box">'+(title?"<h3>"+esc(title)+"</h3>":"")+inner+"</section>":"";}
function link(u,t){return /^https:\/\//.test(u||"")?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t||u)+"</a>":"";}
function isPoe2(){return M.game==="poe2";}

var TABS=[["overview","Overview"],["leveling","Leveling"],["tree","Passive Tree"],["gems","Gems"],["gear","Gear"],["layers","Layers"],["playstyle","Playstyle"],["filter","Loot Filter"],["sources","Sources"]];

/* ---------- hero ---------- */
(function(){
  var h="";
  if(M.sample)h+='<div class="banner">Sample layout. The build data on this page is placeholder content and has not been verified against the live game.</div>';
  h+='<span class="lbl">'+esc(isPoe2()?"Path of Exile 2":"Path of Exile")+" build blueprint</span>";
  h+="<h1>"+esc(M.title)+"</h1>";
  if(M.summary)h+='<p style="max-width:68ch">'+fmt(M.summary)+"</p>";
  var c=[["Class",[M.class,M.ascendancy].filter(Boolean).join(" / ")],["Goal",M.objective],["League",M.league],["Patch",M.patch],["Verified",M.verified_on]];
  h+='<div class="chips">'+c.filter(function(x){return x[1];}).map(function(x){return'<span class="chip">'+x[0]+" <b>"+esc(x[1])+"</b></span>";}).join("")+"</div>";
  h+='<div class="grades">'+(B.ratings||[]).map(function(r){var g=esc(String(r.grade||"").charAt(0).toUpperCase());return'<div class="grade"><span class="g g'+g+'">'+g+'</span><span><span class="lbl">'+esc(r.vector)+"</span></span></div>";}).join("")+"</div>";
  h+='<p><a class="dl" href="#filter">Loot filter for this build</a></p>';document.getElementById("hero").innerHTML=h;
  document.getElementById("foot").innerHTML="Fan-made guide generated by WraeclastArchitect. Not affiliated with Grinding Gear Games. Icons are original illustrations, not game art. Progress on this page is saved in this browser only.";
})();

/* ---------- level control ---------- */
var range=document.getElementById("lv-range"); range.max=MAX;
function stages(){return (B.gear&&B.gear.stages)||[];}
function stageAt(lv){var st=stages(),cur=st[0]||null;st.forEach(function(s){if((s.from_level||1)<=lv)cur=s;});return cur;}
function setLevel(v){S.level=Math.max(1,Math.min(MAX,v|0));S.stage=null;save();paintLevel();render();}
function paintLevel(){range.value=S.level;document.getElementById("lv-num").textContent=S.level;var s=stageAt(S.level);document.getElementById("lv-stage").textContent=s?s.name:"";}
range.addEventListener("input",function(){setLevel(+range.value);});
document.getElementById("lv-down").addEventListener("click",function(){setLevel(S.level-1);});
document.getElementById("lv-up").addEventListener("click",function(){setLevel(S.level+1);});

/* ---------- pages ---------- */
var P={};
P.overview=function(){
  var o=B.overview||{},h="<h2>Overview and Vector Evaluation</h2>";
  h+='<div class="scroll"><table><thead><tr><th>Vector</th><th>Grade</th><th>Why</th></tr></thead><tbody>'+(B.ratings||[]).map(function(r){var g=esc(String(r.grade||"").charAt(0).toUpperCase());return"<tr><td>"+esc(r.vector)+'</td><td><span class="g'+g+'" style="font-family:var(--display);font-size:1.3rem">'+g+"</span></td><td>"+fmt(r.why)+"</td></tr>";}).join("")+"</tbody></table></div>";
  h+='<div class="cols">'+box("Why this build",list(o.why))+box("Strengths",list(o.strengths,"plus"))+box("Weaknesses",list(o.weaknesses,"minus"))+box("Assumptions",list(M.assumptions))+"</div>";
  return h;
};
P.leveling=function(){
  var st=(B.progression||[]).slice().sort(function(a,b){return a.level-b.level;});
  var due=st.filter(function(s){return s.level<=S.level;}), dn=due.filter(function(s){return S.done[s.id];}).length;
  var nextIdx=-1; st.some(function(s,i){if(!S.done[s.id]){nextIdx=i;return true;}});
  var h="<h2>Leveling Checklist</h2>";
  h+='<p class="muted">Set your character level in the bar above. Steps up to that level are due, later steps are dimmed. Tick each step as you finish it.</p>';
  h+='<div class="tools"><span>'+dn+" of "+due.length+" due steps done</span>"+'<button class="btn" data-act="future" aria-pressed="'+S.future+'">Show later steps</button><button class="btn" data-act="reset">Clear ticks</button></div>';
  h+='<div class="prog"><i style="width:'+(due.length?Math.round(dn/due.length*100):0)+'%"></i></div><div class="steps">';
  st.forEach(function(s,i){
    var fut=s.level>S.level; if(fut&&!S.future)return;
    h+='<label class="srow'+(S.done[s.id]?" done":"")+(fut?" future":"")+(i===nextIdx&&!fut?" next":"")+'"><input type="checkbox" id="st-'+esc(s.id)+'" data-step="'+esc(s.id)+'"'+(S.done[s.id]?" checked":"")+'><span class="at">'+s.level+'</span><span class="tx"><b>'+fmt(s.title)+'</b> <span class="pill">'+esc(s.type||"step")+"</span>"+(s.detail?'<br><span class="muted">'+fmt(s.detail)+"</span>":"")+"</span></label>";
  });
  return h+"</div>";
};
function nodeOn(n){return S.nodes[n.id]!=null?S.nodes[n.id]:(n.level||1)<=S.level;}
P.tree=function(){
  var T=B.tree||{},N=T.nodes||[],byId={},h="<h2>Passive Tree and Ascendancy</h2>";
  N.forEach(function(n,i){byId[n.id]=n;if(n.x==null){var row=Math.floor(i/7),col=i%7;n.x=8+(row%2?6-col:col)*14;n.y=8+row*13;}});
  var pts=N.filter(nodeOn).reduce(function(a,n){return a+(n.points||0);},0), tot=N.reduce(function(a,n){return a+(n.points||0);},0);
  h+='<p class="muted">Route map of the build\'s path through the tree, in the order to take it. It follows your character level. Select a node for details, or mark it taken yourself. This is a schematic of the route, not the full in-game tree.'+(M.planner_url?" "+link(M.planner_url,"Open the full tree planner")+".":"")+"</p>";
  h+='<div class="tools"><span><b>'+pts+"</b> of "+tot+" route points allocated at level "+S.level+'</span><button class="btn" data-act="tree-reset">Follow level again</button></div>';
  var W=1000,H=Math.max(300,Math.max.apply(null,N.map(function(n){return n.y;}).concat([20]))*10+70),svg="";
  (T.edges||[]).forEach(function(e){var a=byId[e[0]],b=byId[e[1]];if(a&&b)svg+='<line class="edge'+(nodeOn(a)&&nodeOn(b)?" on":"")+'" x1="'+a.x*10+'" y1="'+a.y*10+'" x2="'+b.x*10+'" y2="'+b.y*10+'"/>';});
  N.forEach(function(n){
    var x=n.x*10,y=n.y*10,k=n.kind||"travel",sh;
    if(k==="keystone")sh='<rect class="shape" x="'+(x-17)+'" y="'+(y-17)+'" width="34" height="34" transform="rotate(45 '+x+" "+y+')"/>';
    else if(k==="jewel")sh='<rect class="shape" x="'+(x-13)+'" y="'+(y-13)+'" width="26" height="26"/>';
    else if(k==="ascendancy")sh='<polygon class="shape" points="'+[0,1,2,3,4,5].map(function(i){var a=Math.PI/3*i;return (x+20*Math.cos(a)).toFixed(1)+","+(y+20*Math.sin(a)).toFixed(1);}).join(" ")+'"/>';
    else sh='<circle class="shape" cx="'+x+'" cy="'+y+'" r="'+(k==="start"?24:k==="notable"?16:k==="mastery"?13:9)+'"/>';
    svg+='<g class="node'+(nodeOn(n)?" on":"")+(S.node===n.id?" sel":"")+'" data-node="'+esc(n.id)+'" tabindex="0" role="button" aria-label="'+esc(n.name)+'">'+sh+(k!=="travel"?'<text x="'+x+'" y="'+(y+42)+'">'+esc(n.name)+"</text>":"")+"</g>";
  });
  var sel=byId[S.node],side;
  if(sel)side='<span class="lbl">'+esc(sel.kind||"travel")+"</span><h3>"+esc(sel.name)+'</h3><p>Take by level <b>'+(sel.level||1)+"</b>"+(sel.points?" &middot; "+sel.points+" point"+(sel.points>1?"s":""):"")+"</p>"+(sel.note?"<p>"+fmt(sel.note)+"</p>":"")+'<button class="btn" data-act="node-toggle" aria-pressed="'+nodeOn(sel)+'">'+(nodeOn(sel)?"Taken. Mark as not taken":"Mark as taken")+"</button>";
  else side='<p class="muted">Select a node on the map to see when to take it and why.</p>';
  h+='<div class="treewrap"><div class="tree scroll"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Passive tree route map">'+svg+'</svg></div><aside class="box">'+side+"</aside></div>";
  h+='<div class="legend"><span>Large circle: class start</span><span>Circle: notable</span><span>Diamond: keystone</span><span>Square: jewel socket</span><span>Hexagon: Ascendancy</span><span>Small dot: travel nodes</span></div>';
  var asc=T.ascendancy||[];
  if(asc.length)h+='<h3>Ascendancy order</h3><div class="scroll"><table><thead><tr><th>#</th><th>Node</th><th>When</th><th>Why</th></tr></thead><tbody>'+asc.map(function(a,i){return"<tr><td>"+(i+1)+'</td><td class="t-k">'+esc(a.name)+"</td><td>"+esc(a.when||"")+"</td><td>"+fmt(a.why)+"</td></tr>";}).join("")+"</tbody></table></div>";
  function named(a){return list((a||[]).map(function(k){return"{k:"+k.name+"}"+(k.why?": "+k.why:"");}));}
  h+='<div class="cols">'+box("Keystones",named(T.keystones))+box(isPoe2()?"Jewels":"Cluster, Timeless and other Jewels",named(T.jewels))+box(isPoe2()?"Weapon set specialization":"Masteries",named(isPoe2()?T.weapon_sets:T.masteries))+box("Notes",list(T.notes))+"</div>";
  return h;
};
P.gems=function(){
  var G=B.gems||{},h="<h2>Gems and Links</h2>";
  h+='<p class="muted">Setups active at level '+S.level+" are shown in full. Earlier and later setups are dimmed. "+(isPoe2()?"Persistent buffs reserve Spirit.":"Auras reserve Mana.")+"</p>";
  h+='<div class="cols">'+(G.setups||[]).map(function(s){
    var a=(s.from_level||1)<=S.level&&S.level<=(s.to_level||MAX);
    return'<div class="setup'+(a?"":" off")+'"><div class="tools"><h3>'+esc(s.name)+'</h3><span class="pill'+(a?" now":"")+'">'+(a?"Active now":"Lv "+(s.from_level||1)+"\u2013"+(s.to_level||MAX))+"</span></div>"+

function lfZip(name,text){
  var enc=new TextEncoder(),nb=enc.encode(name),db=enc.encode(text),t=[];
  for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  var crc=0xFFFFFFFF;for(var i=0;i<db.length;i++)crc=t[(crc^db[i])&255]^(crc>>>8);crc=(crc^0xFFFFFFFF)>>>0;

  function w2(x){v.setUint16(q,x,true);q+=2;}function w4(x){v.setUint32(q,x,true);q+=4;}
  w4(0x04034b50);w2(20);w2(0x0800);w2(0);w2(tm);w2(dt);w4(crc);w4(db.length);w4(db.length);w2(nb.length);w2(0);o.set(nb,q);q+=nb.length;o.set(db,q);q+=db.length;
  var cd=q;w4(0x02014b50);w2(20);w2(20);w2(0x0800);w2(0);w2(tm);w2(dt);w4(crc);w4(db.length);w4(db.length);w2(nb.length);w2(0);w2(0);w2(0);w2(0);w4(0);w4(0);o.set(nb,q);q+=nb.length;

}

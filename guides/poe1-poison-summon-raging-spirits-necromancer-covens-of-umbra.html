nnot be revived or no-minion style modifiers"]}, "playstyle": {"mapping": [{"step": "Summon, then run", "detail": "Cast {g:Summon Raging Spirit} when you see a pack, then keep moving. The spirits find targets on their own."}, {"step": "Refresh before they expire", "detail": "Spirits time out; re-summon between packs so you always have a full set."}, {"step": "Curse with {g:Arcanist Brand}", "detail": "The brand triggers {g:Desecrate}, {g:Flesh Offering} and {g:Despair} in order, so you do not cast them by hand."}], "bossing": [{"step": "Summon early and stay back", "detail": "Poison needs seconds to stack, so summon as the fight starts."}, {"step": "Swap Splash for single target", "detail": "Replace {g:Melee Splash Support} with {g:Multistrike Support} or {g:Melee Physical Damage Support}."}, {"step": "Keep spirits alive", "detail": "Step out of area attacks; minions die to them first."}], "positioning": ["Stay far enough back that you take no melee hits; you have no leech until Bone Barrier.", "Leave any ground effect before your minions are wiped."], "tips": ["Use {g:Frostblink} or {g:Shield Charge} to reposition fast.", "Keep a spare set of Ghastly Eye jewels with the best poison chance for the belt."]}, "level_guide": [{"level": 1, "gems": ["Start with {g:Fireball}. After Enemy at the Gate take {g:Freezing Pulse} and use either until Breaking Some Eggs."], "gear": ["Wear any armour that drops. Up to 3 sockets until you find item level 25 gear (late Act 2 or Act 3)."]}, {"level": 2, "gems": [], "gear": [], "passives": ["Walk to, in this order: {k:Arcanist's Dominion} (about level 6); {k:Lord of the Dead} (about level 8); {k:Enduring Bond} (about level 12). Take the small nodes on each path."]}, {"level": 4, "gems": ["Take {g:Summon Raging Spirit} from Breaking Some Eggs (Act 1). Level with it from now on."], "gear": []}, {"level": 8, "gems": ["Take {g:Minion Damage Support} and {g:Infernal Legion Support} from The Caged Brute, buy {g:Melee Splash Support} from Nessa, and link them to {g:Summon Raging Spirit}."], "gear": ["Use any wand or sceptre with +1 spell or minion skill levels, and a shield with life."], "detour": ["Act 1: take the Trial of Ascendancy in the Lower Prison (area level 8). You need all six Normal trials, so take each one as you pass it."]}, {"level": 10, "gems": ["Take {g:Clarity} from The Caged Brute if mana is tight."], "gear": []}, {"level": 12, "gems": [], "gear": ["Put {g:Summon Raging Spirit} and its supports in one linked group and the rest in a second. Check each gem's socket colour in game and fix colours with Chromatic Orbs, main group first."]}, {"level": 14, "gems": [], "gear": [], "passives": ["Walk to, in this order: {k:Retribution} (about level 15); {k:Sacrifice} (about level 17); {k:Spiritual Command} (about level 18); {k:Cruel Preparation} (about level 21); {k:Indomitable Army} (about level 25). Take the small nodes on each path."]}, {"level": 16, "gems": ["Take {g:Summon Skitterbots} from Yeena and {g:Desecrate} from Intruders in Black (Act 2)."], "gear": ["Fix resistances on rings, belt and boots."], "detour": ["Act 2: take the Trial of Ascendancy in the Chamber of Sins Level 2 (area level 16)."]}, {"level": 17, "gems": [], "gear": [], "detour": ["Act 2: take the Trial of Ascendancy in the Crypt Level 1 (area level 17)."]}, {"level": 20, "gems": ["Run {g:Clarity}, an Intelligence aura. {k:Commander of Darkness} gives you and allies attack and cast speed for each aura you run, but the other auras I checked (Determination, Vitality) need Strength, so skip them."], "gear": ["Mana: the full endgame setup costs about 138 Mana per second when you cast continuously (measured in Path of Building), so keep {g:Clarity} running and take {k:Deep Thoughts} and {k:Dreamer} (about levels 43 and 51) before you move to the 6-link."]}, {"level": 22, "gems": [], "gear": [], "detour": ["Act 2: kill all three bandits (Oak, Kraityn and Alira) for 2 passive points."]}, {"level": 25, "gems": [], "gear": [], "detour": ["Act 3: take the Trial of Ascendancy in the Crematorium (area level 25)."]}, {"level": 27, "gems": [], "gear": [], "detour": ["Act 3: take the Trial of Ascendancy in the Catacombs, the side area at the Marketplace (area level 27)."]}, {"level": 28, "gems": ["Take {g:Animate Guardian} from Sever the Right Hand (Act 3), optionally."], "gear": [], "passives": ["Walk to, in this order: {k:Decay Ward} (about level 30); {k:Potency of Will} (about level 33). Take the small nodes on each path."]}, {"level": 30, "gems": ["Move {g:Summon Raging Spirit} to a 4-link with {g:Minion Damage Support} and {g:Melee Splash Support}. Add {g:Unleash Support} in Act 4."], "gear": ["Life and resistances come first on every slot. After Act 5 you take -30% to all resistances, and -60% after Act 10, so refill them from the Act 6 shops and your drops."], "detour": ["Act 3: take the Trial of Ascendancy in the Imperial Gardens (area level 30). With all six trials held, the Aspirants' Plaza in the Sarn Encampment opens the Normal Labyrinth."]}, {"level": 33, "gems": ["Run {g:Desecrate} and {g:Flesh Offering} together."], "gear": ["Gear rule while levelling: put a Life prefix on every slot first, then one resistance suffix per slot spread across fire, cold and lightning. Chaos resistance cannot appear on gear below item level 35. Tested in Path of Building at the level 33 stage (best-case rolls, quality removed): baseline 523 Life and 412 effective hit pool; three Magic pieces with a max Life prefix 747 Life and 658; three Rares with Life and a resistance 812; a full legal set (Tribal Circlet, Silk Gloves, Scholar Boots, Silk Robe with a cold resistance suffix) 854 Life and 1,088 effective hit pool with 233 Energy Shield. Gear did not change damage or mana."], "detour": ["DIVERT TO THE NORMAL LABYRINTH: once you hold all six trials (Act 1 Lower Prison, Act 2 Chamber of Sins Level 2 and Crypt Level 1, Act 3 Crematorium, Catacombs and Imperial Gardens), take the Aspirants' Plaza plaque in the Sarn Encampment. Lab level 33 suits characters around 28 to 35 and gives 2 Ascendancy points. Take {k:Commander of Darkness} first: it gives +1 Totem and doubles Totem placement speed and duration, which is the single biggest jump for this build. Finish it before the Act 4 boss."], "passives": ["Ascendancy: {k:Commander of Darkness}."]}, {"level": 36, "gems": [], "gear": [], "passives": ["Walk to, in this order: {k:Purity of Flesh} (about level 37); {k:Righteous Army} (about level 40); {k:Basic Jewel Socket} (about level 41); {k:Deep Thoughts} (about level 43); {k:Heart and Soul} (about level 44). Take the small nodes on each path."]}, {"level": 38, "gems": ["Add {g:Arcanist Brand} to the {g:Desecrate} and {g:Flesh Offering} group if the vendor offers it."], "gear": []}, {"level": 40, "gems": [], "gear": ["Aim for 75% elemental resistances before you enter Act 10. Gem requirements grow with gem level: at level 20, {g:Melee Splash} needs 111 Strength, {g:Chance to Poison} 111 Dexterity and {g:Desecrate} 98 Dexterity. The route reaches them from the tree at about level 60 to 65 with {k:Might}, {k:Precision}, {k:Agility} and {k:Alacrity}, so you do not need gear with Strength or Dexterity. Until then keep those supports at the gem level your attributes allow."]}, {"level": 45, "gems": [], "gear": ["If you have the currency, buy {u:Tabula Rasa}: six white linked sockets, which the author lists as the low-budget alternative to a corrupted 6-link chest."]}, {"level": 46, "gems": [], "gear": [], "passives": ["Walk to, in this order: {k:Redemption} (about level 46); {k:Faith and Steel} (about level 48); {k:Foresight} (about level 49); {k:Dreamer} (about level 51); {k:Quick Recovery} (about level 53); {k:Practical Application} (about level 55); {k:Arcane Focus} (about level 57); {k:Precision} (about level 58); {k:Agility} (about level 60); {k:Alacrity} (about level 63); {k:Might} (about level 64). Take the small nodes on each path."]}, {"level": 47, "gems": [], "gear": [], "detour": ["Act 6: take the Cruel trial in the Prison (area level 47)."]}, {"level": 50, "gems": [], "gear": ["Replace rares with 4-link bodies, then look for a 6-link body armour."]}, {"level": 51, "gems": [], "gear": [], "detour": ["Act 7: take the Cruel trial in the Crypt (area level 51)."]}, {"level": 52, "gems": [], "gear": [], "detour": ["Act 7: take the Cruel trial in the Chamber of Sins Level 2 (area level 52)."]}, {"level": 55, "gems": [], "gear": ["Level 55 gear, tested in Path of Building at the level 55 stage (best-case rolls, quality 0, Energy Shield bases): the baseline is 1,225 Life and 1,133 effective hit pool. Life prefixes on Steel Circlet (+69), Samite Gloves (+62) and Samite Slippers (+62) lift that to 1,551 Life and 1,633; one 29% elemental suffix on each (fire, cold, lightning) gives 25% to each element and 1,990; a 20% chaos suffix on each takes chaos resistance from -52% to 8% and the pool to 2,119. A Rare Destroyer Regalia (level 53, 145 Intelligence) with +92 Life and +29% Fire Resistance then brings you to 1,707 Life, 497 Energy Shield and 2,792 effective hit pool. Priority per slot: Life, then an elemental suffix, then chaos. The Destroyer Regalia showed -3% movement speed in the calculator, so consider a movement speed suffix on the boots."], "detour": ["DIVERT TO THE CRUEL LABYRINTH: after the third Cruel trial, or when you reach the Act 8 town. Lab level 55 suits characters at 50 to 55 and gives 2 more points. Take {k:Mindless Aggression} here."], "passives": ["Ascendancy: {k:Mindless Aggression}."]}, {"level": 57, "gems": [], "gear": [], "detour": ["Act 8: take the Merciless trial in the Bath House (area level 57)."]}, {"level": 60, "gems": [], "gear": ["Craft or buy a Rare Energy Shield chest with +Life: Vaal Regalia needs level 68 and 194 Intelligence, which you can wear."]}, {"level": 62, "gems": [], "gear": [], "detour": ["Act 9: take the Merciless trial in the Tunnel (area level 62)."]}, {"level": 65, "gems": [], "gear": []}, {"level": 67, "gems": [], "gear": [], "detour": ["Act 10: take the Merciless trial in the Ossuary (area level 67), before the Act 10 boss. All three Merciless trials must be done before the lab opens."]}, {"level": 68, "gems": [], "gear": [], "detour": ["DIVERT TO THE MERCILESS LABYRINTH: after the Ossuary trial and before the Act 10 boss. Lab level 68 suits characters at 65 to 70. The next points go toward {k:Unnatural Strength}."], "passives": ["Ascendancy: {k:Unnatural Strength}.", "The route is complete at 84 points. Spend the few points you still have (including the four freed by dropping Physique, since Melee Splash runs at gem level 10) on {k:Ravenous Horde} (minions 30% increased Movement Speed, Onslaught on kill) or {k:Grave Intentions} (minions +27% Chaos Resistance and 20% of their Life as extra Energy Shield), otherwise on small Life and resistance nodes along its paths and on the jewel sockets you pass. The author swaps from a 90-point leveling tree to an endgame tree around now; I could not read his nodes, so I am not listing his respec."]}, {"level": 70, "gems": ["Move {g:Summon Raging Spirit} to a 6-link: {g:Unleash}, {g:Melee Splash}, {g:Chance to Poison}, {g:Added Chaos Damage}, {g:Minion Damage}."], "gear": ["Buy {u:The Jinxed Juju} and {u:Darkness Enthroned}; fill the belt with Ghastly Eye jewels."], "detour": ["Pantheon: use a Divine Vessel to fully unlock the Pantheon, then choose {k:Soul of the Brine King} as the major power and {k:Soul of Shakari} as the minor power."]}, {"level": 72, "gems": [], "gear": [], "detour": ["Start mapping once all three labs are done. The Eternal lab comes from a Labyrinth Trial found in a higher-tier map."]}, {"level": 75, "gems": [], "gear": [], "detour": ["ETERNAL LABYRINTH (after the campaign): needs an Offering to the Goddess, usually from a Labyrinth Trial in a Tier 6 or higher map. Lab level 75. Finish {k:Bone Barrier}."], "passives": ["Ascendancy: {k:Bone Barrier}."]}, {"level": 84, "gems": [], "gear": ["Move to a Rare Twilight Regalia (level 84, 293 Intelligence) once you have the Intelligence for it."]}, {"level": 85, "gems": [], "gear": ["Upgrade to {u:The Covenant} or a corrupted 6-link body armour if currency allows."]}, {"level": 90, "gems": ["Poison endgame setup: {g:Unleash}, {g:Melee Splash} or {g:Multistrike}, {g:Chance to Poison}, {g:Minion Damage}, {g:Void Manipulation}."], "gear": []}], "campaign": [{"act": 1, "levels": "Levels 1 to 13", "mandatory": ["The Hillock", "Mud Flats glyphs (opens Submerged Passage)", "Brutus in the Upper Prison (opens Prisoner's Gate)", "Ship Graveyard (Allflame and Fairgraves)", "Merveil in the Cavern of Anger"], "worth": ["Enemy at the Gate, Breaking Some Eggs, The Caged Brute and The Siren's Cadence: skill gem rewards", "Dweller of the Deep and The Marooned Mariner: a passive point each", "A Dirty Job: 2 passive respec points", "Lord's Labyrinth: Trial of Ascendancy in the Lower Prison"], "skip": ["Fire Fury, Kuduku, Ironpoint, the Faun, Chatters, Ungulath, Burning Menace, Stranglecharm, Amarissa, Ambrosia, the Hailrake fight and most Coast and Ledge enemies"], "lab": "Trial 1 of 6: Lower Prison"}, {"act": 2, "levels": "Levels 13 to 23", "mandatory": ["Crossroads and Riverways", "Western Forest (Captain Arteri, Ancient Seal path)", "The Weaver (drops Maligaro's Spike)", "Vaal Ruins and the Vaal Oversoul", "Deal with the Bandits (The Apex, needed to enter the Pyramid)"], "worth": ["Sharp and Cruel, Intruders in Black: skill gem rewards", "The Way Forward: a passive point", "Kill all three bandits: 2 passive points", "Through Sacred Ground: 2 passive respec points", "Lord's Labyrinth: two Trials of Ascendancy"], "skip": ["Calaf, Gneiss, Bravalo, Soulmourn, Targa, Seleslatha, Q'uru, Archbishop Geofri, and the Fellshrine Ruins (unless you need the Trial)"], "lab": "Trials 2 and 3 of 6: Chamber of Sins Level 2 and The Crypt Level 1"}, {"act": 3, "levels": "Levels 23 to 33", "mandatory": ["Guard Captain and Lost in Love (opens the Sewers)", "Piety in the Crematorium", "Ribbon Spool in the Battlefront", "Thaumetic Sulphite in the Docks", "Infernal Talc in the Solaris Temple", "Lunaris Temple and Piety", "Sceptre of God and Dominus (final boss)"], "worth": ["Lost in Love, Sever the Right Hand: skill gem rewards", "A Fixture of Fate (the Library): support gems, and Siosa's gem shop", "Victario's Secrets: a passive point and 2 respec points", "Piety's Pets: a passive point", "Lord's Labyrinth: three Trials of Ascendancy"], "skip": ["Perpetus, Hatebeat, Captain Aurelianus, Shipyard Terror, Goddess of Purity, Kole, Fleshrend, Spinecrack, Tyrannursus, Thistlesage, Conqueror Wurm, Caliga, Paradisae Venenum, Trinian and A Swig of Hope"], "lab": "Trials 4 to 6 of 6: The Crematorium, The Catacombs, The Imperial Gardens. Then run the Normal Labyrinth."}, {"act": 4, "levels": "Levels 33 to 40", "mandatory": ["Voll (Deshret's Banner opens the Mines)", "Kaom and King Kaom (Eye of Fury)", "Daresso and the Grand Arena (Eye of Desire)", "Belly of the Beast", "Piety, the Abomination", "The Harvest (Maligaro, Shavronne, Doedre for Malachai's organs)", "Malachai"], "worth": ["Breaking the Seal, The King of Desire, The Eternal Nightmare: skill gem rewards", "An Indomitable Spirit: a passive point and 2 respec points"], "skip": ["Hundred Foot Shadow, Pikerivet, Hammerstorm, Voidscream, Torchoak Grove, Triskeriaki, Eyepecker, Steelchaw, The Bone Queen, The Burning Man and The White Death"]}, {"act": 5, "levels": "Levels 40 to 45", "mandatory": ["Overseer Krow (Return to Oriath)", "Justicar Casticus (Eyes of Zeal)", "High Templar Avarius and Innocence", "The Ossuary (The Ravenous God)", "Kitava"], "worth": ["In Service to Science: a passive point", "Kitava's Torments: a passive point and 2 respec points", "Death to Purity and The King's Feast: jewel rewards"], "skip": ["The Matriarch, Cato, The Risen Matriarch, Utula (optional kill, but gives a jewel choice) and the Stately Hideout"]}, {"act": 6, "levels": "Levels 45 to 52", "mandatory": ["Karui Fortress and Tukohama (The Father of War)", "Shavronne's Tower and Brutus (Essence of Umbra)", "Brine King's Reef and Tsoagoth"], "worth": ["Fallen from Grace: 2 respec points and unlocks Lilly Roth's gem shop", "The Father of War, The Cloven One, The Puppet Mistress: a passive point each", "Lord's Labyrinth: the Cruel Trial in the Lower Prison"], "skip": ["Rhys of Abram (except for the Fallen from Grace reward), Raihara, Riptide, Dishonoured Queen (except for the Eye of Conquest), Fleetfreak, Defiled Proclamation, The Animal Pack, Hollowskull and Brinecrack"], "lab": "Cruel trial 1 of 3: Lower Prison"}, {"act": 7, "levels": "Levels 52 to 58", "mandatory": ["Greust (route to the Northern Forest)", "Gruthkul (Lighting the Way, route to the Causeway)", "Arakaali (final boss)", "The Temple of Decay path through Yeena"], "worth": ["The Master of a Million Faces, Queen of Despair and Kishara's Star: a passive point each (Kishara's Star also gives 2 respec points)", "Lord's Labyrinth: two Cruel Trials"], "skip": ["Bundle of Woe, Plague Retch, Tunnelworm, The Dreadstone, The Bone Sculptor, The Great White Bones and Blightblade. Maligaro's Sanctum is not skippable: it drops the Black Venom for the Chamber of Sins Level 2 key."], "lab": "Cruel trials 2 and 3 of 3: The Crypt Level 1 and Chamber of Sins Level 2. Then run the Cruel Labyrinth."}, {"act": 8, "levels": "Levels 58 to 63", "mandatory": ["Doedre the Vile (Essence of the Hag)", "Tolman and the Quay", "Dawn (Solar Eclipse, Sun Orb) and Dusk (Lunar Eclipse, Moon Orb)", "Solaris and Lunaris (final boss)"], "worth": ["Love is Dead: a passive point and 2 respec points", "The Gemling Legion and Reflection of Terror: a passive point each", "Lord's Labyrinth: the Merciless Trial in the Bath House"], "skip": ["Lingering Abberation, Effigy of Fear, Ondar, Regulus, Nightbringer Lucius and the Solaris Concourse"], "lab": "Merciless trial 1 of 3: The Bath House"}, {"act": 9, "levels": "Levels 63 to 67", "mandatory": ["The Storm Blade and Bottled Storm (opens the Oasis)", "Shakari (Queen of the Sands)", "Garukhan and Kira (The Ruler of Highgate)", "General Adus (Trarthan Powder)", "Doedre Darksoul, Maligaro the Broken and Shavronne Unbound", "The Depraved Trinity (final boss)"], "worth": ["Queen of the Sands and The Ruler of Highgate: a passive point each", "Fastis Fortuna: 2 respec points", "Lord's Labyrinth: the Merciless Trial in the Tunnels"], "skip": ["Hundred Foot Shadow, Boulderback, Droolmaw, the Basilisk, the Forbidden Vault and the Desert Hideout"], "lab": "Merciless trial 2 of 3: The Tunnels"}, {"act": 10, "levels": "Levels 67 to 70", "mandatory": ["Plaguewing (frees Bannon)", "The Torched Courts and Innocence route", "Vilenta"], "worth": ["Vilenta's Vengeance: a passive point", "Safe Passage and An End to Hunger: quest rewards", "Lord's Labyrinth: the Merciless Trial in the Ossuary"], "skip": ["The Reliquary. The source I used ended after Vilenta, so check the rest of Act 10 in game."], "lab": "Merciless trial 3 of 3: The Ossuary, then run the Merciless Labyrinth before the Act 10 boss."}], "campaign_note": "Act ranges are approximate and match the area levels you will see. Mandatory means required to progress or to open the next area. The lists come from community campaign references that may date from 2023, so check any act that looks different in game. Passive point rewards add up over the campaign; resistances take a -30% penalty after Act 5 and again after Act 10.", "gem_sources": {"intro": "Summon Raging Spirit and its first supports come from Act 1 quests. Nessa in Act 1, Yeena in Act 2, Siosa in Act 3 and Lilly Roth in Acts 6 and 10 are the shops.", "rows": [{"gem": "Summon Raging Spirit", "act": 1, "source": "Quest reward: Breaking Some Eggs", "level": "Level 4", "conf": "Confirmed"}, {"gem": "Melee Splash", "act": 1, "source": "The Caged Brute, Nessa (vendor)", "level": "Level 8", "conf": "Confirmed"}, {"gem": "Infernal Legion", "act": 1, "source": "Quest reward: The Caged Brute, or Nessa", "level": "Level 8", "conf": "Check in game if it is missing"}, {"gem": "Minion Damage", "act": 1, "source": "Quest reward: The Caged Brute", "level": "Level 8", "conf": "Confirmed"}, {"gem": "Clarity", "act": 1, "source": "Quest reward: The Caged Brute", "level": "Level 10", "conf": "Confirmed"}, {"gem": "Fireball", "act": 1, "source": "Starting gem", "level": "Level 1", "conf": "Confirmed"}, {"gem": "Summon Skitterbots", "act": 2, "source": "Yeena (Act 2 vendor)", "level": "Level 16", "conf": "Confirmed"}, {"gem": "Desecrate", "act": 2, "source": "Quest reward: Intruders in Black", "level": "Level 16", "conf": "Confirmed"}, {"gem": "Animate Guardian", "act": 3, "source": "Quest reward: Sever the Right Hand", "level": "Level 28", "conf": "Confirmed"}, {"gem": "Anger", "act": 3, "source": "Act 3 (unconfirmed)", "level": "Not confirmed", "conf": "Buy it from a vendor if the quest does not offer it"}, {"gem": "Arcanist Brand", "act": 4, "source": "Act 4 vendor", "level": "Level 4 and up", "conf": "Check in game"}, {"gem": "Melee Physical Damage, Added Fire Damage, Multistrike, Chance to Poison, Added Chaos Damage, Unleash", "act": 0, "source": "Vendors or quest rewards in later acts; not individually checked", "level": "Level 18 and up", "conf": "Class not confirmed"}], "note": "Rows marked Confirmed were checked; anything else, check in game."}, "sources": [{"title": "BalorMage's Poison Summon Raging Spirits Necromancer Build Guide", "url": "https://www.poe-vault.com/guides/balormage-summon-raging-spirits-necromancer-build-guide", "site": "PoE Vault", "note": "Pros, cons, gem stages, defenses; dated 12 Nov 2026."}, {"title": "Necromancer PoB, Passive Skill Tree and Gem Links", "url": "https://www.poe-vault.com/guides/balormage-summon-raging-spirits-necromancer-pob-passive-skill-tree-gem-links", "site": "PoE Vault", "note": "Gem links by budget, masteries, jewels; the passive tree is only in the linked PoB."}, {"title": "Necromancer Ascendancy, Bandits and Pantheon", "url": "https://www.poe-vault.com/guides/balormage-summon-raging-spirits-necromancer-ascendancy-bandits-pantheon-powers", "site": "PoE Vault", "note": "Ascendancy order, bandits, pantheon."}, {"title": "Author's Path of Building", "url": "https://pobb.in/7_6IS6EVRZfT", "site": "pobb.in", "note": "Not readable from my environment; the route here is rebuilt from tree data."}], "confidence_notes": ["Path of Building tests on a naked level 100 character with the route: the same Rare body armour with +137 Life gave about +1,284 effective hit pool as a Twilight Regalia, about +1,001 as a Vaal Regalia and +247 as a Royal Plate (which also needs 293 Strength and costs 5% movement speed). Energy Shield scales with the tree and about +2% per 10 Intelligence. These come from item stats I chose, not real tier values.", "The import code has no gear and no auras enabled by default; mana sustain is a known problem (58 Mana per cast, about 138 Mana per second at 2.38 casts per second against 48 regeneration).", "Summon Raging Spirit has a 5 second base duration, a 0.5 second cast time and a cap of 20 spirits, per poedb. Unleash may not modify some minion skills, according to the same page; the author uses it, so test it in game.", "Route, Life and duration changes were reasoned from tree data and gem text, not simulated; load the code in Path of Building with your gear to compare real numbers.", "This guide is synthesised from community guides and databases used as references; none is needed to follow it.", "I could not open the author's Path of Building tree, so the passive route is my own reconstruction from 3.30 tree data (notable names and stats are real; picks, order and levels are mine).", "Level estimates assume one point per level plus about 24 quest points by Act 10.", "Ascendancy order and pantheon (Brine King upgraded, Shakari) come from the author's Ascendancy page; the lab levels are the standard lab levels.", "Anger (author: Act 3, poedb: no Witch source) and Infernal Legion (Tidal Island vs The Caged Brute) conflict between sources and are flagged in the gem table.", "Gem and gear performance claims, including over 200,000 effective health, are the author's own and untested.", "The author swaps trees near level 68; the exact respec nodes were not readable, so none are listed. The 3.30 gold cost of respeccing was not verified.", "The Pob import code is built from tree data and has not been loaded in Path of Building yet; add any gem that does not load by name.", "Gear tiers in the Leveling tab were measured in Path of Building by the user at the level 33 and level 55 route stages with best-case max-roll Life and 29% elemental or 20% chaos resistance suffixes and quality removed; real drops will roll lower. The resistance penalty setting in the calculator was not confirmed. The Destroyer Regalia -3% movement speed is as shown in the calculator.", "Passive Tree tab map: node positions are computed from the 3.30 tree export (group position plus orbit), drawn with straight lines where the game draws short arcs. The advice to find a notable with the passive tree search box, and that clicking a distant notable spends points along the shortest path, is from memory of the game and was not verified in this session. Step directions are arrows on the tree as drawn, not compass bearings.", "Path of Building import code is stamped for the 3.30 tree. Only the Scion code has been opened in Path of Building so far; this one has not.", "Early game checked for class access, gem level requirements and socket limits by item level. The level at which each Act 1 quest finishes is an estimate.", "Arcanist Brand access for the Witch is unconfirmed.", "Trial of Ascendancy detours sit at the area level of the area that holds the trial (Normal: Lower Prison 8, Chamber of Sins Level 2 16, Crypt Level 1 17, Crematorium 25, Catacombs 27, Imperial Gardens 30; Cruel: Prison 47, Crypt 51, Chamber of Sins Level <script>
(function(){
"use strict";
var B=JSON.parse(document.getElementById("build-data").textContent);
var M=B.meta||{}, MAX=M.max_level||100, KEY="wa:"+(M.slug||M.title||"build");
var S={level:1,done:{},nodes:{},stage:null,slot:null,node:null,wset:1,future:true};
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null"); if(sv){S.level=sv.level||1;S.done=sv.done||{};S.nodes=sv.nodes||{};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({level:S.level,done:S.done,nodes:S.nodes}));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
/* {g:Gem} {u:Unique} {r:Rare} {m:Magic} {k:Keystone/Notable} {c:Currency} */
function fmt(s){return esc(s).replace(/\{([gurmkc]):([^}]+)\}/g,'<span class="t-$1">$2</span>');}
function list(a,cls){return a&&a.length?'<ul class="plain '+(cls||"")+'">'+a.map(function(x){return"<li>"+fmt(x)+"</li>";}).join("")+"</ul>":"";}
function box(title,inner){return inner?'<section class="box">'+(title?"<h3>"+esc(title)+"</h3>":"")+inner+"</section>":"";}
function link(u,t){return /^https:\/\//.test(u||"")?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t||u)+"</a>":"";}
function isPoe2(){return M.game==="poe2";}

var TABS=[["overview","Overview"],["leveling","Leveling"],["tree","Passive Tree"],["gems","Gems"],["gear","Gear"],["layers","Layers"],["playstyle","Playstyle"],["filter","Loot Filter"],["sources","Sources"]];

/* ---------- hero ---------- */
(function(){
  var h="";
  if(M.sample)h+='<div class="banner">Sample layout. The build data on this page is placeholder content and has not been verified against the live game.</div>';
  h+='<span class="lbl">'+esc(isPoe2()?"Path of Exile 2":"Path of Exile")+" build blueprint</span>";
  h+="<h1>"+esc(M.title)+"</h1>";
  if(M.summary)h+='<p style="max-width:68ch">'+fmt(M.summary)+"</p>";
  var c=[["Class",[M.class,M.ascendancy].filter(Boolean).join(" / ")],["Goal",M.objective],["League",M.league],["Patch",M.patch],["Verified",M.verified_on]];
  h+='<div class="chips">'+c.filter(function(x){return x[1];}).map(function(x){return'<span class="chip">'+x[0]+" <b>"+esc(x[1])+"</b></span>";}).join("")+"</div>";
  h+='<div class="grades">'+(B.ratings||[]).map(function(r){var g=esc(String(r.grade||"").charAt(0).toUpperCase());return'<div class="grade"><span class="g g'+g+'">'+g+'</span><span><span class="lbl">'+esc(r.vector)+"</span></span></div>";}).join("")+"</div>";
  h+='<p><a class="dl" href="#filter">Loot filter for this build</a></p>';document.getElementById("hero").innerHTML=h;
  document.getElementById("foot").innerHTML="Fan-made guide generated by WraeclastArchitect. Not affiliated with Grinding Gear Games. Icons are original illustrations, not game art. Progress on this page is saved in this browser only.";
})();

/* ---------- level control ---------- */
var range=document.getElementById("lv-range"); range.max=MAX;
function stages(){return (B.gear&&B.gear.stages)||[];}
function stageAt(lv){var st=stages(),cur=st[0]||null;st.forEach(function(s){if((s.from_level||1)<=lv)cur=s;});return cur;}
function setLevel(v){S.level=Math.max(1,Math.min(MAX,v|0));S.stage=null;save();paintLevel();render();}
function paintLevel(){range.value=S.level;document.getElementById("lv-num").textContent=S.level;var s=stageAt(S.level);document.getElementById("lv-stage").textContent=s?s.name:"";}
range.addEventListener("input",function(){setLevel(+range.value);});
document.getElementById("lv-down").addEventListener("click",function(){setLevel(S.level-1);});
document.getElementById("lv-up").addEventListener("click",function(){setLevel(S.level+1);});

/* ---------- pages ---------- */
var P={};
P.overview=function(){
  var o=B.overview||{},h="<h2>Overview and Vector Evaluation</h2>";
  h+='<div class="scroll"><table><thead><tr><th>Vector</th><th>Grade</th><th>Why</th></tr></thead><tbody>'+(B.ratings||[]).map(function(r){var g=esc(String(r.grade||"").charAt(0).toUpperCase());return"<tr><td>"+esc(r.vector)+'</td><td><span class="g'+g+'" style="font-family:var(--display);font-size:1.3rem">'+g+"</span></td><td>"+fmt(r.why)+"</td></tr>";}).join("")+"</tbody></table></div>";
  h+='<div class="cols">'+box("Why this build",list(o.why))+box("Strengths",list(o.strengths,"plus"))+box("Weaknesses",list(o.weaknesses,"minus"))+box("Assumptions",list(M.assumptions))+"</div>";
  return h;
};
P.leveling=function(){
  var st=(B.progression||[]).slice().sort(function(a,b){return a.level-b.level;});
  var due=st.filter(function(s){return s.level<=S.level;}), dn=due.filter(function(s){return S.done[s.id];}).length;
  var nextIdx=-1; st.some(function(s,i){if(!S.done[s.id]){nextIdx=i;return true;}});
  var h="<h2>Leveling Checklist</h2>";
  h+='<p class="muted">Set your character level in the bar above. Steps up to that level are due, later steps are dimmed. Tick each step as you finish it.</p>';
  h+='<div class="tools"><span>'+dn+" of "+due.length+" due steps done</span>"+'<button class="btn" data-act="future" aria-pressed="'+S.future+'">Show later steps</button><button class="btn" data-act="reset">Clear ticks</button></div>';
  h+='<div class="prog"><i style="width:'+(due.length?Math.round(dn/due.length*100):0)+'%"></i></div><div class="steps">';
  st.forEach(function(s,i){
    var fut=s.level>S.level; if(fut&&!S.future)return;
    h+='<label class="srow'+(S.done[s.id]?" done":"")+(fut?" future":"")+(i===nextIdx&&!fut?" next":"")+'"><input type="checkbox" id="st-'+esc(s.id)+'" data-step="'+esc(s.id)+'"'+(S.done[s.id]?" checked":"")+'><span class="at">'+s.level+'</span><span class="tx"><b>'+fmt(s.title)+'</b> <span class="pill">'+esc(s.type||"step")+"</span>"+(s.detail?'<br><span class="muted">'+fmt(s.detail)+"</span>":"")+"</span></label>";
  });
  return h+"</div>";
};
function nodeOn(n){return S.nodes[n.id]!=null?S.nodes[n.id]:(n.level||1)<=S.level;}
P.tree=function(){
  var T=B.tree||{},N=T.nodes||[],byId={},h="<h2>Passive Tree and Ascendancy</h2>";
  N.forEach(function(n,i){byId[n.id]=n;if(n.x==null){var row=Math.floor(i/7),col=i%7;n.x=8+(row%2?6-col:col)*14;n.y=8+row*13;}});
  var pts=N.filter(nodeOn).reduce(function(a,n){return a+(n.points||0);},0), tot=N.reduce(function(a,n){return a+(n.points||0);},0);
  h+='<p class="muted">Route map of the build\'s path through the tree, in the order to take it. It follows your character level. Select a node for details, or mark it taken yourself. This is a schematic of the route, not the full in-game tree.'+(M.planner_url?" "+link(M.planner_url,"Open the full tree planner")+".":"")+"</p>";
  h+='<div class="tools"><span><b>'+pts+"</b> of "+tot+" route points allocated at level "+S.level+'</span><button class="btn" data-act="tree-reset">Follow level again</button></div>';
  var W=1000,H=Math.max(300,Math.max.apply(null,N.map(function(n){return n.y;}).concat([20]))*10+70),svg="";
  (T.edges||[]).forEach(function(e){var a=byId[e[0]],b=byId[e[1]];if(a&&b)svg+='<line class="edge'+(nodeOn(a)&&nodeOn(b)?" on":"")+'" x1="'+a.x*10+'" y1="'+a.y*10+'" x2="'+b.x*10+'" y2="'+b.y*10+'"/>';});
  N.forEach(function(n){
    var x=n.x*10,y=n.y*10,k=n.kind||"travel",sh;
    if(k==="keystone")sh='<rect class="shape" x="'+(x-17)+'" y="'+(y-17)+'" width="34" height="34" transform="rotate(45 '+x+" "+y+')"/>';
    else if(k==="jewel")sh='<rect class="shape" x="'+(x-13)+'" y="'+(y-13)+'" width="26" height="26"/>';
    else if(k==="ascendancy")sh='<polygon class="shape" points="'+[0,1,2,3,4,5].map(function(i){var a=Math.PI/3*i;return (x+20*Math.cos(a)).toFixed(1)+","+(y+20*Math.sin(a)).toFixed(1);}).join(" ")+'"/>';
    else sh='<circle class="shape" cx="'+x+'" cy="'+y+'" r="'+(k==="start"?24:k==="notable"?16:k==="mastery"?13:9)+'"/>';
    svg+='<g class="node'+(nodeOn(n)?" on":"")+(S.node===n.id?" sel":"")+'" data-node="'+esc(n.id)+'" tabindex="0" role="button" aria-label="'+esc(n.name)+'">'+sh+(k!=="travel"?'<text x="'+x+'" y="'+(y+42)+'">'+esc(n.name)+"</text>":"")+"</g>";
  });
  var sel=byId[S.node],side;
  if(sel)side='<span class="lbl">'+esc(sel.kind||"travel")+"</span><h3>"+esc(sel.name)+'</h3><p>Take by level <b>'+(sel.level||1)+"</b>"+(sel.points?" &middot; "+sel.points+" point"+(sel.points>1?"s":""):"")+"</p>"+(sel.note?"<p>"+fmt(sel.note)+"</p>":"")+'<button class="btn" data-act="node-toggle" aria-pressed="'+nodeOn(sel)+'">'+(nodeOn(sel)?"Taken. Mark as not taken":"Mark as taken")+"</button>";
  else side='<p class="muted">Select a node on the map to see when to take it and why.</p>';
  h+='<div class="treewrap"><div class="tree scroll"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Passive tree route map">'+svg+'</svg></div><aside class="box">'+side+"</aside></div>";
  h+='<div class="legend"><span>Large circle: class start</span><span>Circle: notable</span><span>Diamond: keystone</span><span>Square: jewel socket</span><span>Hexagon: Ascendancy</span><span>Small dot: travel nodes</span></div>';
  var asc=T.ascendancy||[];
  if(asc.length)h+='<h3>Ascendancy order</h3><div class="scroll"><table><thead><tr><th>#</th><th>Node</th><th>When</th><th>Why</th></tr></thead><tbody>'+asc.map(function(a,i){return"<tr><td>"+(i+1)+'</td><td class="t-k">'+esc(a.name)+"</td><td>"+esc(a.when||"")+"</td><td>"+fmt(a.why)+"</td></tr>";}).join("")+"</tbody></table></div>";
  function named(a){return list((a||[]).map(function(k){return"{k:"+k.name+"}"+(k.why?": "+k.why:"");}));}
  h+='<div class="cols">'+box("Keystones",named(T.keystones))+box(isPoe2()?"Jewels":"Cluster, Timeless and other Jewels",named(T.jewels))+box(isPoe2()?"Weapon set specialization":"Masteries",named(isPoe2()?T.weapon_sets:T.masteries))+box("Notes",list(T.notes))+"</div>";
  return h;
};
P.gems=function(){
  var G=B.gems||{},h="<h2>Gems and Links</h2>";
  h+='<p class="muted">Setups active at level '+S.level+" are shown in full. Earlier and later setups are dimmed. "+(isPoe2()?"Persistent buffs reserve Spirit.":"Auras reserve Mana.")+"</p>";
  h+='<div class="cols">'+(G.setups||[]).map(function(s){
    var a=(s.from_level||1)<=S.level&&S.level<=(s.to_level||MAX);
    return'<div class="setup'+(a?"":" off")+'"><div class="tools"><h3>'+esc(s.name)+'</h3><span class="pill'+(a?" now":"")+'">'+(a?"Active now":"Lv "+(s.from_level||1)+"\u2013"+(s.to_level||MAX))+"</span></div>"+
      '<span class="lbl">'+esc([s.role,s.slot].filter(Boolean).join(" \u00b7 "))+"</span>"+
      '<div class="sockets"><span class="sock main">'+esc(s.skill)+"</span>"+(s.supports||[]).map(function(x){return'<span class="link"></span><span class="sock sup" title="'+esc(x.note||"")+'">'+esc(x.name||x)+"</span>";}).join("")+"</div>"+
      (s.reservation?'<p><span class="lbl">'+(isPoe2()?"Spirit":"Reservation")+"</span> "+esc(s.reservation)+"</p>":"")+(s.note?'<p class="muted">'+fmt(s.note)+"</p>":"")+"</div>";
  }).join("")+"</div>";
  h+='<div class="cols">'+box(isPoe2()?"Uncut Gem priority":"Gem acquisition",list(G.priority))+box("Notes",list(G.notes))+"</div>";
  return h;
};
var ICON={weapon:'<path d="M22 4 26 8 12 22 8 22 8 18Z"/><path d="M6 20 10 24M5 27 9 23"/>',offhand:'<path d="M15 4 25 8V15C25 21 21 25 15 27 9 25 5 21 5 15V8Z"/>',helmet:'<path d="M6 22V14A9 9 0 0 1 24 14V22H18V16H12V22Z"/>',body:'<path d="M9 5 15 8 21 5 26 10 22 13V26H8V13L4 10Z"/>',gloves:'<path d="M9 26V14L7 9 10 8 12 12V5H15V12 4H18V12 6H21V16L23 13 25 15 21 22V26Z"/>',boots:'<path d="M10 4H17V17L25 21V26H8V20L10 17Z"/>',belt:'<rect x="3" y="11" width="24" height="8"/><rect x="12" y="9" width="6" height="12"/>',amulet:'<path d="M7 4C7 14 23 14 23 4"/><path d="M15 12 19 18 15 26 11 18Z"/>',ring:'<circle cx="15" cy="18" r="7"/><path d="M12 9 15 5 18 9 15 12Z"/>'};
function ico(k){return'<svg viewBox="0 0 30 30" aria-hidden="true">'+(ICON[k.replace(/\d+$/,"")]||ICON.ring)+"</svg>";}
var SLOTS=[["weapon","Weapon"],["helmet","Helmet"],["amulet","Amulet"],["offhand","Off-hand"],["body","Body Armour"],["ring1","Ring"],["ring2","Ring"],["gloves","Gloves"],["belt","Belt"],["boots","Boots"]];
P.gear=function(){
  var G=B.gear||{},st=stages(),cur=(S.stage&&st.filter(function(s){return s.id===S.stage;})[0])||stageAt(S.level)||{slots:{}},h="<h2>Gear Priorities</h2>";
  var has2=cur.slots&&(cur.slots.weapon2||cur.slots.offhand2);
  h+='<div class="tools"><span class="lbl">Gear stage</span>'+st.map(function(s){return'<button class="btn" data-stage="'+esc(s.id)+'" aria-pressed="'+(s===cur)+'">'+esc(s.name)+' <span class="muted">'+(s.from_level||1)+"+</span></button>";}).join("")+
    (has2?'<span class="lbl">Weapon set</span><button class="btn" data-wset="1" aria-pressed="'+(S.wset===1)+'">I</button><button class="btn" data-wset="2" aria-pressed="'+(S.wset===2)+'">II</button>':"")+"</div>";
  function get(k){if(S.wset===2&&has2&&(k==="weapon"||k==="offhand"))return cur.slots[k+"2"];return cur.slots[k];}
  if(!S.slot||!get(S.slot))S.slot=(SLOTS.filter(function(s){return get(s[0]);})[0]||[null])[0];
  h+='<div class="gearwrap"><div class="doll">'+SLOTS.map(function(s){var it=get(s[0]);
    return'<button class="slot'+(it?" r-"+esc(it.rarity||"rare"):" empty")+'" style="grid-area:'+s[0]+'" data-slot="'+s[0]+'" aria-pressed="'+(S.slot===s[0])+'"'+(it?"":" disabled")+">"+ico(s[0])+'<span class="lbl">'+s[1]+'</span><span class="nm">'+esc(it?it.name:"Any")+"</span></button>";}).join("")+"</div>";
  var it=S.slot&&get(S.slot);
  if(it){
    var lab=SLOTS.filter(function(s){return s[0]===S.slot;})[0][1];
    h+='<div class="item"><header><div class="n r-'+esc(it.rarity||"rare")+'">'+esc(it.name)+'</div><div class="lbl">'+esc(it.base||lab)+"</div></header><div class=\"bd\">"+

function lfText(){var n=document.getElementById("loot-filter");return n?n.textContent:"";}
function lfZip(name,text){
  var enc=new TextEncoder(),nb=enc.encode(name),db=enc.encode(text),t=[];
  for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  var crc=0xFFFFFFFF;for(var i=0;i<db.length;i++)crc=t[(crc^db[i])&255]^(crc>>>8);crc=(crc^0xFFFFFFFF)>>>0;
  var d=new Date(),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  var L=30+nb.length,C=46+nb.length,o=new Uint8Array(L+db.length+C+22),v=new DataView(o.buffer),q=0;
  function w2(x){v.setUint16(q,x,true);q+=2;}function w4(x){v.setUint32(q,x,true);q+=4;}
  w4(0x04034b50);w2(20);w2(0x0800);w2(0);w2(tm);w2(dt);w4(crc);w4(db.length);w4(db.length);w2(nb.length);w2(0);o.set(nb,q);q+=nb.length;o.set(db,q);q+=db.length;
  var cd=q;w4(0x02014b50);w2(20);w2(20);w2(0x0800);w2(0);w2(tm);w2(dt);w4(crc);w4(db.length);w4(db.length);w2(nb.length);w2(0);w2(0);w2(0);w2(0);w4(0);w4(0);o.set(nb,q);q+=nb.length;
  w4(0x06054b50);w2(0);w2(0);w2(1);w2(1);w4(C);w4(cd);w2(0);return o;
}

function render(){
  var t=tab();

var page=document.getElementById("page");
page.addEventListener("change",function(e){var id=e.target.getAttribute("data-step");if(id){if(e.target.checked)S.done[id]=1;else delete S.done[id];save();render();}});
function act(el){
  var d=el.closest("[data-act],[data-stage],[data-wset],[data-slot],[data-node]");if(!d)return;
  if(d.dataset.node){S.node=d.dataset.node;}
  else if(d.dataset.slot){S.slot=d.dataset.slot;}
  else if(d.dataset.stage){S.stage=d.dataset.stage;S.slot=null;}
  else if(d.dataset.wset){S.wset=+d.dataset.wset;}
  else if(d.dataset.act==="future"){S.future=!S.future;}
  else if(d.dataset.act==="reset"){S.done={};save();}
  else if(d.dataset.act==="tree-reset"){S.nodes={};save();}
  else if(d.dataset.act==="node-toggle"){var n=(B.tree.nodes||[]).filter(function(x){return x.id===S.node;})[0];if(n){S.nodes[n.id]=!nodeOn(n);save();}}
  render();
}
page.addEventListener("click",function(e){act(e.target);});
page.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.closest(".node")){e.preventDefault();act(e.target);}});
(B.progression||[]).forEach(function(s,i){if(!s.id)s.id="s"+i;});

})();

<style>
/* Layout: sticky command bar (build name, level dial, tabs) over one content column; each tab is a page.
   Dark-first: obsidian and tarnished bronze, with the in-game rarity colours carrying item meaning. */
:root{
  color-scheme:dark;
  --bg:#0c0a09; --panel:#161210; --panel2:#1e1815; --line:#3a2e24; --line2:#5a4634;
  --fg:#d9cdb8; --dim:#9a8b76; --head:#e8d5a8; --accent:#c8a45c; --accent-ink:#1a1206; --ember:#b5482a;
  --normal:#c8c8c8; --magic:#8f8fff; --rare:#f2e96b; --unique:#d9783a; --gem:#2fc4b4; --cur:#b8a983; --key:#e8d5a8;
  --ok:#7fb069; --warn:#e0a53a; --bad:#d9573f;
  --gS:#e0a53a; --gA:#7fb069; --gB:#6f9fd8; --gC:#9a8b76;
  --display:"Marcellus SC","Palatino Linotype",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ece3d0; --panel:#f6efdf; --panel2:#e4d8bf; --line:#c9b995; --line2:#a08a62;
  --fg:#2c2319; --dim:#6b5b45; --head:#4a2f12; --accent:#8a5a1c; --accent-ink:#fff6e2; --ember:#a33a1e;
  --normal:#4a4a4a; --magic:#3b3bc4; --rare:#8a6d00; --unique:#a8480f; --gem:#0f7f74; --cur:#6f6040; --key:#4a2f12;
  --ok:#3f7a2c; --warn:#9a6a00; --bad:#b23a22;
  --gS:#9a6a00; --gA:#3f7a2c; --gB:#2f5fa8; --gC:#6b5b45;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);color:var(--head);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.02em}
h1{font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.1}
h2{font-size:1.45rem;border-bottom:1px solid var(--line);padding-bottom:6px}
h3{font-size:1.1rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.t-g{color:var(--gem)}.t-u{color:var(--unique)}.t-r{color:var(--rare)}.t-m{color:var(--magic)}.t-k{color:var(--key);font-family:var(--display)}.t-c{color:var(--cur)}
.t-g,.t-u,.t-r,.t-m,.t-c{font-weight:500}

/* hero */
.hero{padding-block:22px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--bg))}
.hero .wrap{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);padding:1px 9px;font-size:.82rem;color:var(--dim);background:var(--panel)}
.chip b{color:var(--fg);font-weight:500}
.banner{border:1px solid var(--warn);color:var(--warn);padding:6px 10px;font-size:.9rem;background:var(--panel)}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grade{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:8px 10px;min-width:0}
.grade .g{font-family:var(--display);font-size:1.9rem;line-height:1;width:1.2em;text-align:center}
.gS{color:var(--gS)}.gA{color:var(--gA)}.gB{color:var(--gB)}.gC{color:var(--gC)}
@media (max-width:640px){.grades{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* command bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line2)}
.bar .wrap{display:flex;flex-direction:column;gap:6px;padding-block:8px 0}
.level{display:flex;align-items:center;gap:10px}
.level .stage{white-space:nowrap}
.level .step{flex:none}
@media (max-width:640px){.level .lbl{display:none}}
.level input[type=range]{flex:1 1 0;min-width:0;accent-color:var(--accent)}
.lv{font-family:var(--display);font-size:1.5rem;color:var(--head);min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.step{width:30px;height:30px;border:1px solid var(--line2);background:var(--panel2);line-height:1}
.stage{font-size:.85rem;color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tabs a{flex:none;padding:7px 12px;text-decoration:none;color:var(--dim);font-family:var(--display);font-size:.98rem;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--head);border-bottom-color:var(--accent)}

main{padding-block:22px 48px}
.page{display:flex;flex-direction:column;gap:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.cols>*{min-width:0}
.box{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.plain li{padding-left:16px;position:relative}
ul.plain li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;background:var(--accent);transform:rotate(45deg)}
ul.plus li::before{background:var(--ok)} ul.minus li::before{background:var(--bad)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--dim);font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.muted{color:var(--dim)}
.off{opacity:.42}
.pill{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;padding:0 7px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.pill.now{border-color:var(--accent);color:var(--accent)}
.pill.must{border-color:var(--ember);color:var(--ember)}

/* leveling checklist */
.prog{height:6px;background:var(--panel2);border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent)}
.steps{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:auto 3.2em minmax(0,1fr);gap:10px;align-items:start;padding:9px 6px;border-bottom:1px solid var(--line)}
.srow input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.srow .at{font-family:var(--display);color:var(--head);font-variant-numeric:tabular-nums}
.srow.done .tx{text-decoration:line-through;opacity:.5}
.srow.future{opacity:.45}
.srow.next{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:var(--panel2);padding:4px 12px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"] .muted{color:inherit;opacity:.75}

/* tree map */
.treewrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
@media (max-width:820px){.treewrap{grid-template-columns:minmax(0,1fr)}}
.tree{background:radial-gradient(ellipse at 50% 40%,var(--panel2),var(--panel));border:1px solid var(--line)}
.tree svg{display:block;width:100%;min-width:560px;height:auto}
.edge{stroke:var(--line2);stroke-width:3;fill:none}
.edge.on{stroke:var(--accent);stroke-width:4}
.node{cursor:pointer}
.node .shape{fill:var(--panel);stroke:var(--line2);stroke-width:2.5}
.node.on .shape{fill:var(--accent);stroke:var(--head)}
.node.sel .shape{stroke:var(--ember);stroke-width:4}
.node text{fill:var(--dim);font-family:var(--body);font-size:15px;text-anchor:middle;pointer-events:none;stroke:var(--panel);stroke-width:5px;paint-order:stroke;stroke-linejoin:round}
.node.on text{fill:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--dim)}

/* gems */
.setup{background:var(--panel);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.setup.off{border-style:dashed}
.sockets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sock{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);padding:3px 9px 3px 5px;border-radius:999px}
.sock::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--gem)}
.sock.main{border-color:var(--gem)}
.sock.main::before{box-shadow:0 0 0 2px var(--panel2),0 0 0 3px var(--gem)}
.sock.sup::before{background:var(--dim)}
.link{width:10px;height:2px;background:var(--accent)}

/* gear doll */
.gearwrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.gearwrap{grid-template-columns:minmax(0,1fr)}}
.doll{display:grid;gap:6px;grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-areas:"weapon helmet amulet offhand" "weapon body body offhand" "ring1 body body ring2" "gloves belt belt boots";
  background:var(--panel);border:1px solid var(--line);padding:10px}
.slot{min-width:0;min-height:86px;border:1px solid var(--line2);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;text-align:center}
.slot svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;flex:none}
.slot .nm{font-size:.8rem;line-height:1.15;overflow-wrap:anywhere}
.slot[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slot.empty{opacity:.4;border-style:dashed}
.r-normal{color:var(--normal)}.r-magic{color:var(--magic)}.r-rare{color:var(--rare)}.r-unique{color:var(--unique)}
.item{background:var(--panel);border:1px solid var(--line2);min-width:0}
.item header{padding:8px 12px;text-align:center;border-bottom:1px solid var(--line2);background:var(--panel2)}
.item header .n{font-family:var(--display);font-size:1.2rem}
.item .bd{padding:12px;display:flex;flex-direction:column;gap:10px}
.aff{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.aff>*{min-width:0}
.aff li{color:var(--magic)}
footer{border-top:1px solid var(--line);padding-block:14px;color:var(--dim);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.prog i,.node .shape,.edge{transition:all .2s}}
</style>

a. Blink Arrow and Frostblink are your two movement skills for the whole game."]}, {"level": 11, "passives": ["Leg 4 (7 points): walk to {k:Primeval Force} (25% increased Elemental Damage during any Flask Effect; 25% increased Elemental Damage with Attack Skills). Done by about level 16."], "detour": ["PASSIVE POINT: The Marooned Mariner (Act 1): find Captain Fairgraves' Allflame in the Ship Graveyard and bring it to Bestel."]}, {"level": 12, "gems": ["Kill Merveil and take {g:Rain of Arrows} from The Siren's Cadence. Move it into the bow: {g:Rain of Arrows} - {g:Mirage Archer Support} - {g:Added Cold Damage Support}. This is your leveling skill until level 68.", "Also buy {g:Elemental Hit} from Nessa and keep it in your stash: you transfigure it later."]}, {"level": 13, "detour": ["PASSIVE POINT: The Way Forward (Act 1): follow the quest log after you reach the Forest Encampment in Act 2; it opens the road back to Act 1."]}, {"level": 16, "gems": ["Kill Fidelitas and take {g:Herald of Ice} from Intruders in Black: frozen and shattered packs explode into the next pack."], "detour": ["Normal Labyrinth trial in the Chamber of Sins Level 2 (area level 16). Step on the plaque at the end."]}, {"level": 17, "passives": ["Leg 5 (5 points): walk to {k:Farsight} (24% increased Damage with Bows; 6% increased Attack Speed with Bows). Done by about level 20."], "detour": ["Normal Labyrinth trial in the Crypt Level 1 (area level 17). Step on the plaque at the end.", "PASSIVE POINT: Through Sacred Ground (Act 2): find the Golden Hand in the Crypt under the Fellshrine Ruins and bring it to Yeena."]}, {"level": 18, "passives": ["Spend the Bow Mastery next to {k:Farsight} on the projectile speed option (increases and reductions to projectile speed also apply to damage with bows)."], "gems": ["Kill the Weaver and take {g:Trinity Support} from Sharp and Cruel. Buy {g:Elemental Damage with Attacks Support} and {g:Faster Attacks Support} from Yeena."]}, {"level": 20, "detour": ["Deal with the Bandits: help Alira for +15% to all elemental resistances. Killing all three bandits instead gives an extra passive point but no resistances; the route assumes Alira."]}, {"level": 21, "passives": ["Leg 6 (6 points): walk to {k:Avatar of the Hunt} (30% increased Damage with Bows; +200 to Evasion Rating). Done by about level 26."]}, {"level": 25, "gems": ["Hand in Lost in Love and buy {g:Haste} and {g:Sniper's Mark} from Clarissa. Run Haste with Herald of Ice; cast Sniper's Mark on bosses only."], "gear": ["Item level 25+ items now drop: on a 4-link bow run {g:Rain of Arrows} - {g:Mirage Archer Support} - {g:Added Cold Damage Support} - {g:Elemental Damage with Attacks Support}.", "{u:Prismweave} (belt, level 25) adds flat fire, cold and lightning to attacks and resistances: the best cheap leveling unique for this build.", "Craft resistances on the hideout bench when bosses hit hard; keep fire, cold and lightning as close to 75% as you can."], "detour": ["Normal Labyrinth trial in the Crematorium (area level 25). Step on the plaque at the end."]}, {"level": 26, "passives": ["Leg 7 (2 points): walk to {k:Thick Skin} (10% increased maximum Life; 8% chance to Avoid Elemental Ailments). Done by about level 27."], "detour": ["PASSIVE POINT: Victario's Secrets (Act 3): find Victario's busts in the Sewers, then talk to Hargan in Sarn."]}, {"level": 27, "detour": ["Normal Labyrinth trial in the Catacombs (area level 27). Step on the plaque at the end."]}, {"level": 28, "passives": ["Leg 8 (3 points): walk to {k:Herbalism} (10% increased maximum Life; 30% increased Flask Recovery rate). Done by about level 30."], "gems": ["Kill Gravicius and take {g:Artillery Ballista} from Sever the Right Hand. It replaces Shrapnel Ballista: {g:Artillery Ballista} - {g:Added Cold Damage Support} - {g:Elemental Damage with Attacks Support}."], "gear": ["{r:Royal Bow} (level 28) is the best leveling bow base. Craft flat lightning damage on it at the bench."]}, {"level": 30, "detour": ["Normal Labyrinth trial in the Imperial Gardens (area level 30). Step on the plaque at the end."]}, {"level": 31, "passives": ["Leg 9 (1 point): walk to {k:Intuition} (+8% chance to Suppress Spell Damage; 15% increased Evasion Rating).", "Leg 10 (5 points): walk to {k:Revenge of the Hunted} (18% increased Evasion Rating; 10% increased maximum Life). Done by about level 35."], "gems": ["Finish A Fixture of Fate and take {g:Focused Ballista Support}: add it to Artillery Ballista for bosses. Buy {g:Lifetap Support} from Siosa for Sniper's Mark."], "detour": ["PASSIVE POINT: Piety's Pets (Act 3): kill Piety in the Lunaris Temple, then return to Sarn."]}, {"level": 33, "detour": ["DIVERT TO THE NORMAL LABYRINTH: with all six trials done, run it from Sarn and take {k:Gathering Winds}."]}, {"level": 35, "gear": ["Item level 35+ items can have five sockets: add {g:Faster Attacks Support} as the fifth Rain of Arrows link."]}, {"level": 36, "passives": ["Leg 11 (5 points): walk to {k:Acuity} (6% increased Attack Speed; +100 to Accuracy Rating). Done by about level 39."], "detour": ["PASSIVE POINT: An Indomitable Spirit (Act 4): free Deshret's spirit in the Mines, then talk to Kira in Highgate."]}, {"level": 38, "gems": ["After Malachai buy {g:Mark On Hit Support} from Petarus and Vanja and link it to {g:Sniper's Mark}: the mark now lands on rares and bosses by itself. Buy {g:Returning Projectiles Support} too (Eternal Nightmare reward) for later."]}, {"level": 40, "passives": ["Leg 12 (7 points): walk to {k:Path of the Hunter} (+100 to Accuracy Rating; 16% increased Projectile Damage). Done by about level 44."]}, {"level": 41, "detour": ["PASSIVE POINT: In Service to Science (Act 5): find Vilenta's Miasmeter in the Control Blocks and return it to Vilenta in the Overseer's Tower."]}, {"level": 44, "detour": ["PASSIVE POINT: Kitava's Torments (Act 5): find Kitava's three Torments in the Reliquary and bring them to Lani."]}, {"level": 45, "passives": ["Leg 13 (7 points): walk to {k:Depth Perception} (+100 to Accuracy Rating; 25% increased Critical Strike Chance). Done by about level 49."], "gear": ["Kitava at the end of Act 5 lowers all resistances by 30%. Refill fire, cold and lightning to 75% before Act 6."]}, {"level": 47, "detour": ["Cruel Labyrinth trial in the Prison (Act 6), area level 47.", "PASSIVE POINT: The Father of War (Act 6): kill Tukohama in the Karui Fortress, then talk to Tarkleigh."]}, {"level": 48, "detour": ["PASSIVE POINT: The Puppet Mistress (Act 6): defeat Ryslatha in the Wetlands, then talk to Sin."]}, {"level": 49, "passives": ["Leg 14 (1 point): walk to {k:Precise Technique} (40% more Attack Damage if Accuracy Rating is higher than Maximum Life\nNever deal Critical Strikes).", "Before you click {k:Precise Technique}, open your character sheet: your Accuracy Rating must be higher than your maximum Life or you lose the 40% more attack damage. Keep {g:Precision} running and accuracy on gear until it is."], "detour": ["PASSIVE POINT: The Cloven One (Act 6): defeat Abberath in the Prisoner's Gate, then talk to Bestel."]}, {"level": 50, "passives": ["Leg 15 (5 points): walk to {k:Master Fletcher} (Bow Attacks fire an additional Arrow). Done by about level 52."], "gems": ["Buy {g:Immortal Call} from Lilly Roth in Act 6 and later {g:Cast when Damage Taken Support} (Act 4 vendor) so it casts itself."], "detour": ["Pantheon: Soul of the Brine King as major god (no repeated stuns, frozen immunity when upgraded)."]}, {"level": 51, "detour": ["Cruel Labyrinth trial in the Crypt (Act 7), area level 51.", "PASSIVE POINT: The Master of a Million Faces (Act 7): kill Ralakesh in the Ashen Fields, then talk to Eramir."]}, {"level": 52, "detour": ["Cruel Labyrinth trial in the Chamber of Sins Level 2 (Act 7), area level 52.", "PASSIVE POINT: Kishara's Star (Act 7): find Kishara's Star in the Causeway and deliver it to Weylam Roth in the Bridge Encampment.", "Pantheon: Soul of Ralakesh unlocks in Act 7 as minor god (no extra damage from moving while bleeding)."]}, {"level": 53, "passives": ["Leg 16 (2 points): walk to {k:Quickstep} (+10% chance to Suppress Spell Damage; 6% increased Movement Speed). Done by about level 54."]}, {"level": 54, "passives": ["Leg 17 (3 points): walk to {k:Survivalist} (24% increased Evasion Rating; +8% to all Elemental Resistances). Done by about level 56."], "detour": ["PASSIVE POINT: Queen of Despair (Act 7): kill Gruthkul in the Dread Thicket, then talk to Eramir."]}, {"level": 55, "detour": ["DIVERT TO THE CRUEL LABYRINTH: take {k:Far Shot}."]}, {"level": 56, "passives": ["Leg 18 (5 points): walk to {k:Harrier} (8% increased Attack Speed; 6% increased Cast Speed). Done by about level 58."], "detour": ["PASSIVE POINT: Reflection of Terror (Act 8): kill Yugul in the High Gardens, then talk to Hargan."]}, {"level": 57, "detour": ["Merciless Labyrinth trial in the Bath House (Act 8), area level 57.", "PASSIVE POINT: Love is Dead (Act 8): find the Ankh of Eternity in the Quay and bring it to Clarissa."]}, {"level": 58, "detour": ["PASSIVE POINT: The Gemling Legion (Act 8): kill the Gemling Legionnaires in the Grain Gate, then talk to Maramoa."]}, {"level": 59, "passives": ["Leg 19 (2 points): walk to {k:Aspect of the Lynx} (20% increased Attack Damage; 5% increased Movement Speed). Done by about level 60."]}, {"level": 60, "gear": ["Switch the life flask to a {m:Divine Life Flask} with bleed immunity."], "detour": ["Pantheon: Soul of Lunaris unlocks in Act 8. Keep the Brine King until freeze is covered, then switch."]}, {"level": 61, "passives": ["Leg 20 (4 points): walk to {k:Charisma} (16% increased Mana Reservation Efficiency of Skills; 6% increased effect of Non-Curse Auras from your Skills). Done by about level 62."], "detour": ["PASSIVE POINT: The Ruler of Highgate (Act 9): kill Kira in the Quarry and deliver the Sekhema Feather to Tasuni in Highgate."]}, {"level": 62, "detour": ["Merciless Labyrinth trial in the Tunnel (Act 9), area level 62.", "PASSIVE POINT: Queen of the Sands (Act 9): kill Shakari (Sin gives the quest in Highgate)."]}, {"level": 63, "passives": ["Leg 21 (6 points): walk to {k:Blood Siphon} (10% increased maximum Life; Gain 10 Life per Enemy Killed). Done by about level 67."], "gear": ["Body armour: {u:Daresso's Defiance} (level 63) is cheap and gives life, life leech and onslaught when hit; {u:Hyrri's Ire} (level 65) gives 30% spell suppression and flat cold. Either holds your 6-link."]}, {"level": 64, "gear": ["Socket a Large Cluster Jewel with elemental attack passives into the Large Jewel Socket (leg 24)."], "detour": ["PASSIVE POINT: Vilenta's Vengeance (Act 10): kill Vilenta in the Control Blocks, then talk to Lani."]}, {"level": 66, "gear": ["{r:Imperial Bow} (level 66) is the endgame base: flat elemental damage, attack speed, and +1 arrow if you can afford it."]}, {"level": 67, "passives": ["Leg 22 (2 points): walk to {k:Blood Drinker} (10% increased maximum Life; Recover 2% of Life on Kill). Done by about level 68."], "gear": ["Kitava in Act 10 lowers resistances by another 30% (60% in total). Refill to 75% before your first map."], "detour": ["Merciless Labyrinth trial in the Ossuary (Act 10), area level 67.", "PASSIVE POINT: An End to Hunger (Act 10): kill Kitava in the Feeding Trough, then talk to Lani."]}, {"level": 68, "gems": ["SWITCH TO ELEMENTAL HIT OF THE SPECTRUM: buy {g:Elemental Hit of the Spectrum} or transfigure your Elemental Hit at the Divine Font after the Merciless Labyrinth. 6-link: {g:Elemental Hit of the Spectrum} - {g:Mirage Archer Support} - {g:Trinity Support} - {g:Elemental Damage with Attacks Support} - {g:Returning Projectiles Support} - {g:Faster Attacks Support}.", "Boots: {g:Manaforged Arrows Support} - {g:Frenzy} - {g:Ensnaring Arrow}: frenzy charges and ensnare cast themselves as you shoot.", "Endgame ballista for bosses: {g:Artillery Ballista} - {g:Focused Ballista Support} - {g:Inspiration Support} - {g:Elemental Damage with Attacks Support} - {g:Immolate Support} - {g:Added Cold Damage Support}.", "Lightning Arrow instead of Elemental Hit: take {g:Lightning Arrow} with the same links if you buy {u:Hyrri's Ire}; it gains more from the chest's flat cold."], "detour": ["DIVERT TO THE MERCILESS LABYRINTH before Kitava in Act 10: take {k:Endless Munitions}, then switch your main skill."]}, {"level": 69, "passives": ["Leg 23 (3 points): walk to {k:Hired Killer} (7% increased maximum Life; Recover 2% of Life on Kill). Done by about level 71."]}, {"level": 72, "passives": ["Leg 24 (3 points): walk to Large Jewel Socket. Done by about level 74."]}, {"level": 75, "passives": ["Leg 25 (5 points): walk to {k:Longshot} (30% increased Projectile Speed; Projectiles gain Damage as they travel farther, dealing up\nto 60% increased Damage with Hits to targets). Done by about level 79."], "gear": ["Boots Eldritch implicit: chance to avoid elemental ailments. With {k:Thick Skin} and an ailment flask you can drop Purity of Elements."], "detour": ["DIVERT TO THE ETERNAL LABYRINTH (needs an Offering to the Goddess): take {k:Occupying Force}."]}, {"level": 80, "passives": ["Leg 26 (3 points): walk to {k:Fleetfoot} (30% increased Evasion Rating; 5% increased Movement Speed). Done by about level 82."]}, {"level": 83, "passives": ["Leg 27 (2 points): walk to {k:Sentinel} (24% increased Evasion Rating and Armour; +10% to all Elemental Resistances). Done by about level 84."]}, {"level": 85, "passives": ["Leg 28 (4 points): walk to {k:Constitution} (+20 to maximum Life; 10% increased maximum Life). Done by about level 88."]}], "tree": {"nodes": [{"id": "start", "name": "Ranger", "kind": "start", "x": 41.4, "y": 26.9, "level": 1, "points": 0, "note": "Class start."}, {"id": "n5", "name": "Ballistics", "kind": "notable", "x": 52.7, "y": 26.9, "level": 6, "points": 5, "note": "20% increased Projectile Speed; 20% increased Projectile Damage; +20 to Dexterity"}, {"id": "n9", "name": "Finesse", "kind": "notable", "x": 52.7, "y": 32.2, "level": 9, "points": <script>
(function(){
"use strict";
var B=JSON.parse(document.getElementById("build-data").textContent);
var M=B.meta||{}, MAX=M.max_level||100, KEY="wa:"+(M.slug||M.title||"build");
var S={level:1,done:{},nodes:{},stage:null,slot:null,node:null,wset:1,future:true};
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null"); if(sv){S.level=sv.level||1;S.done=sv.done||{};S.nodes=sv.nodes||{};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({level:S.level,done:S.done,nodes:S.nodes}));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
/* {g:Gem} {u:Unique} {r:Rare} {m:Magic} {k:Keystone/Notable} {c:Currency} */
function fmt(s){return esc(s).replace(/\{([gurmkc]):([^}]+)\}/g,'<span class="t-$1">$2</span>');}
function list(a,cls){return a&&a.length?'<ul class="plain '+(cls||"")+'">'+a.map(function(x){return"<li>"+fmt(x)+"</li>";}).join("")+"</ul>":"";}
function box(title,inner){return inner?'<section class="box">'+(title?"<h3>"+esc(title)+"</h3>":"")+inner+"</section>":"";}
function link(u,t){return /^https:\/\//.test(u||"")?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t||u)+"</a>":"";}
function isPoe2(){return M.game==="poe2";}

var TABS=[["overview","Overview"],["leveling","Leveling"],["tree","Passive Tree"],["gems","Gems"],["gear","Gear"],["layers","Layers"],["playstyle","Playstyle"],["filter","Loot Filter"],["sources","Sources"]];

/* ---------- hero ---------- */
(function(){
  var h="";
  if(M.sample)h+='<div class="banner">Sample layout. The build data on this page is placeholder content and has not been verified against the live game.</div>';
  h+='<span class="lbl">'+esc(isPoe2()?"Path of Exile 2":"Path of Exile")+" build blueprint</span>";
  h+="<h1>"+esc(M.title)+"</h1>";
  if(M.summary)h+='<p style="max-width:68ch">'+fmt(M.summary)+"</p>";
  var c=[["Class",[M.class,M.ascendancy].filter(Boolean).join(" / ")],["Goal",M.objective],["League",M.league],["Patch",M.patch],["Verified",M.verified_on]];
  h+='<div class="chips">'+c.filter(function(x){return x[1];}).map(function(x){return'<span class="chip">'+x[0]+" <b>"+esc(x[1])+"</b></span>";}).join("")+"</div>";
  h+='<div class="grades">'+(B.ratings||[]).map(function(r){var g=esc(String(r.grade||"").charAt(0).toUpperCase());return'<div class="grade"><span class="g g'+g+'">'+g+'</span><span><span class="lbl">'+esc(r.vector)+"</span></span></div>";}).join("")+"</div>";
  h+='<p><a class="dl" href="#filter">Loot filter for this build</a></p>';document.getElementById("hero").innerHTML=h;
  document.getElementById("foot").innerHTML="Fan-made guide generated by WraeclastArchitect. Not affiliated with Grinding Gear Games. Icons are original illustrations, not game art. Progress on this page is saved in this browser only.";
})();

/* ---------- level control ---------- */
var range=document.getElementById("lv-range"); range.max=MAX;
function stages(){return (B.gear&&B.gear.stages)||[];}
function stageAt(lv){var st=stages(),cur=st[0]||null;st.forEach(function(s){if((s.from_level||1)<=lv)cur=s;});return cur;}
function setLevel(v){S.level=Math.max(1,Math.min(MAX,v|0));S.stage=null;save();paintLevel();render();}
function paintLevel(){range.value=S.level;document.getElementById("lv-num").textContent=S.level;var s=stageAt(S.level);document.getElementById("lv-stage").textContent=s?s.name:"";}
range.addEventListener("input",function(){setLevel(+range.value);});
document.getElementById("lv-down").addEventListener("click",function(){setLevel(S.level-1);});
document.getElementById("lv-up").addEventListener("click",function(){setLevel(S.level+1);});

/* ---------- pages ---------- */
var P={};
P.overview=function(){
  var o=B.overview||{},h="<h2>Overview and Vector Evaluation</h2>";
  h+='<div class="scroll"><table><thead><tr><th>Vector</th><th>Grade</th><th>Why</th></tr></thead><tbody>'+(B.ratings||[]).map(function(r){var g=esc(String(r.grade||"").charAt(0).toUpperCase());return"<tr><td>"+esc(r.vector)+'</td><td><span class="g'+g+'" style="font-family:var(--display);font-size:1.3rem">'+g+"</span></td><td>"+fmt(r.why)+"</td></tr>";}).join("")+"</tbody></table></div>";
  h+='<div class="cols">'+box("Why this build",list(o.why))+box("Strengths",list(o.strengths,"plus"))+box("Weaknesses",list(o.weaknesses,"minus"))+box("Assumptions",list(M.assumptions))+"</div>";
  return h;
};
P.leveling=function(){
  var st=(B.progression||[]).slice().sort(function(a,b){return a.level-b.level;});
  var due=st.filter(function(s){return s.level<=S.level;}), dn=due.filter(function(s){return S.done[s.id];}).length;
  var nextIdx=-1; st.some(function(s,i){if(!S.done[s.id]){nextIdx=i;return true;}});
  var h="<h2>Leveling Checklist</h2>";
  h+='<p class="muted">Set your character level in the bar above. Steps up to that level are due, later steps are dimmed. Tick each step as you finish it.</p>';
  h+='<div class="tools"><span>'+dn+" of "+due.length+" due steps done</span>"+'<button class="btn" data-act="future" aria-pressed="'+S.future+'">Show later steps</button><button class="btn" data-act="reset">Clear ticks</button></div>';
  h+='<div class="prog"><i style="width:'+(due.length?Math.round(dn/due.length*100):0)+'%"></i></div><div class="steps">';
  st.forEach(function(s,i){
    var fut=s.level>S.level; if(fut&&!S.future)return;
    h+='<label class="srow'+(S.done[s.id]?" done":"")+(fut?" future":"")+(i===nextIdx&&!fut?" next":"")+'"><input type="checkbox" id="st-'+esc(s.id)+'" data-step="'+esc(s.id)+'"'+(S.done[s.id]?" checked":"")+'><span class="at">'+s.level+'</span><span class="tx"><b>'+fmt(s.title)+'</b> <span class="pill">'+esc(s.type||"step")+"</span>"+(s.detail?'<br><span class="muted">'+fmt(s.detail)+"</span>":"")+"</span></label>";
  });
  return h+"</div>";
};
function nodeOn(n){return S.nodes[n.id]!=null?S.nodes[n.id]:(n.level||1)<=S.level;}
P.tree=function(){
  var T=B.tree||{},N=T.nodes||[],byId={},h="<h2>Passive Tree and Ascendancy</h2>";
  N.forEach(function(n,i){byId[n.id]=n;if(n.x==null){var row=Math.floor(i/7),col=i%7;n.x=8+(row%2?6-col:col)*14;n.y=8+row*13;}});
  var pts=N.filter(nodeOn).reduce(function(a,n){return a+(n.points||0);},0), tot=N.reduce(function(a,n){return a+(n.points||0);},0);
  h+='<p class="muted">Route map of the build\'s path through the tree, in the order to take it. It follows your character level. Select a node for details, or mark it taken yourself. This is a schematic of the route, not the full in-game tree.'+(M.planner_url?" "+link(M.planner_url,"Open the full tree planner")+".":"")+"</p>";
  h+='<div class="tools"><span><b>'+pts+"</b> of "+tot+" route points allocated at level "+S.level+'</span><button class="btn" data-act="tree-reset">Follow level again</button></div>';
  var W=1000,H=Math.max(300,Math.max.apply(null,N.map(function(n){return n.y;}).concat([20]))*10+70),svg="";
  (T.edges||[]).forEach(function(e){var a=byId[e[0]],b=byId[e[1]];if(a&&b)svg+='<line class="edge'+(nodeOn(a)&&nodeOn(b)?" on":"")+'" x1="'+a.x*10+'" y1="'+a.y*10+'" x2="'+b.x*10+'" y2="'+b.y*10+'"/>';});
  N.forEach(function(n){
    var x=n.x*10,y=n.y*10,k=n.kind||"travel",sh;
    if(k==="keystone")sh='<rect class="shape" x="'+(x-17)+'" y="'+(y-17)+'" width="34" height="34" transform="rotate(45 '+x+" "+y+')"/>';
    else if(k==="jewel")sh='<rect class="shape" x="'+(x-13)+'" y="'+(y-13)+'" width="26" height="26"/>';
    else if(k==="ascendancy")sh='<polygon class="shape" points="'+[0,1,2,3,4,5].map(function(i){var a=Math.PI/3*i;return (x+20*Math.cos(a)).toFixed(1)+","+(y+20*Math.sin(a)).toFixed(1);}).join(" ")+'"/>';
    else sh='<circle class="shape" cx="'+x+'" cy="'+y+'" r="'+(k==="start"?24:k==="notable"?16:k==="mastery"?13:9)+'"/>';
    svg+='<g class="node'+(nodeOn(n)?" on":"")+(S.node===n.id?" sel":"")+'" data-node="'+esc(n.id)+'" tabindex="0" role="button" aria-label="'+esc(n.name)+'">'+sh+(k!=="travel"?'<text x="'+x+'" y="'+(y+42)+'">'+esc(n.name)+"</text>":"")+"</g>";
  });
  var sel=byId[S.node],side;
  if(sel)side='<span class="lbl">'+esc(sel.kind||"travel")+"</span><h3>"+esc(sel.name)+'</h3><p>Take by level <b>'+(sel.level||1)+"</b>"+(sel.points?" &middot; "+sel.points+" point"+(sel.points>1?"s":""):"")+"</p>"+(sel.note?"<p>"+fmt(sel.note)+"</p>":"")+'<button class="btn" data-act="node-toggle" aria-pressed="'+nodeOn(sel)+'">'+(nodeOn(sel)?"Taken. Mark as not taken":"Mark as taken")+"</button>";
  else side='<p class="muted">Select a node on the map to see when to take it and why.</p>';
  h+='<div class="treewrap"><div class="tree scroll"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Passive tree route map">'+svg+'</svg></div><aside class="box">'+side+"</aside></div>";
  h+='<div class="legend"><span>Large circle: class start</span><span>Circle: notable</span><span>Diamond: keystone</span><span>Square: jewel socket</span><span>Hexagon: Ascendancy</span><span>Small dot: travel nodes</span></div>';
  var asc=T.ascendancy||[];
  if(asc.length)h+='<h3>Ascendancy order</h3><div class="scroll"><table><thead><tr><th>#</th><th>Node</th><th>When</th><th>Why</th></tr></thead><tbody>'+asc.map(function(a,i){return"<tr><td>"+(i+1)+'</td><td class="t-k">'+esc(a.name)+"</td><td>"+esc(a.when||"")+"</td><td>"+fmt(a.why)+"</td></tr>";}).join("")+"</tbody></table></div>";
  function named(a){return list((a||[]).map(function(k){return"{k:"+k.name+"}"+(k.why?": "+k.why:"");}));}
  h+='<div class="cols">'+box("Keystones",named(T.keystones))+box(isPoe2()?"Jewels":"Cluster, Timeless and other Jewels",named(T.jewels))+box(isPoe2()?"Weapon set specialization":"Masteries",named(isPoe2()?T.weapon_sets:T.masteries))+box("Notes",list(T.notes))+"</div>";
  return h;
};
P.gems=function(){
  var G=B.gems||{},h="<h2>Gems and Links</h2>";
  h+='<p class="muted">Setups active at level '+S.level+" are shown in full. Earlier and later setups are dimmed. "+(isPoe2()?"Persistent buffs reserve Spirit.":"Auras reserve Mana.")+"</p>";
  h+='<div class="cols">'+(G.setups||[]).map(function(s){
    var a=(s.from_level||1)<=S.level&&S.level<=(s.to_level||MAX);
    return'<div class="setup'+(a?"":" off")+'"><div class="tools"><h3>'+esc(s.name)+'</h3><span class="pill'+(a?" now":"")+'">'+(a?"Active now":"Lv "+(s.from_level||1)+"–"+(s.to_level||MAX))+"</span></div>"+
      '<span class="lbl">'+esc([s.role,s.slot].filter(Boolean).join(" · "))+"</span>"+
      '<div class="sockets"><span class="sock main">'+esc(s.skill)+"</span>"+(s.supports||[]).map(function(x){return'<span class="link"></span><span class="sock sup" title="'+esc(x.note||"")+'">'+esc(x.name||x)+"</span>";}).join("")+"</div>"+
      (s.reservation?'<p><span class="lbl">'+(isPoe2()?"Spirit":"Reservation")+"</span> "+esc(s.reservation)+"</p>":"")+(s.note?'<p class="muted">'+fmt(s.note)+"</p>":"")+"</div>";
  }).join("")+"</div>";
  h+='<div class="cols">'+box(isPoe2()?"Uncut Gem priority":"Gem acquisition",list(G.priority))+box("Notes",list(G.notes))+"</div>";
  return h;
};
var ICON={weapon:'<path d="M22 4 26 8 12 22 8 22 8 18Z"/><path d="M6 20 10 24M5 27 9 23"/>',offhand:'<path d="M15 4 25 8V15C25 21 21 25 15 27 9 25 5 21 5 15V8Z"/>',helmet:'<path d="M6 22V14A9 9 0 0 1 24 14V22H18V16H12V22Z"/>',body:'<path d="M9 5 15 8 21 5 26 10 22 13V26H8V13L4 10Z"/>',gloves:'<path d="M9 26V14L7 9 10 8 12 12V5H15V12 4H18V12 6H21V16L23 13 25 15 21 22V26Z"/>',boots:'<path d="M10 4H17V17L25 21V26H8V20L10 17Z"/>',belt:'<rect x="3" y="11" width="24" height="8"/><rect x="12" y="9" width="6" height="12"/>',amulet:'<path d="M7 4C7 14 23 14 23 4"/><path d="M15 12 19 18 15 26 11 18Z"/>',ring:'<circle cx="15" cy="18" r="7"/><path d="M12 9 15 5 18 9 15 12Z"/>'};
function ico(k){return'<svg viewBox="0 0 30 30" aria-hidden="true">'+(ICON[k.replace(/\d+$/,"")]||ICON.ring)+"</svg>";}
var SLOTS=[["weapon","Weapon"],["helmet","Helmet"],["amulet","Amulet"],["offhand","Off-hand"],["body","Body Armour"],["ring1","Ring"],["ring2","Ring"],["gloves","Gloves"],["belt","Belt"],["boots","Boots"]];
P.gear=function(){
  var G=B.gear||{},st=stages(),cur=(S.stage&&st.filter(function(s){return s.id===S.stage;})[0])||stageAt(S.level)||{slots:{}},h="<h2>Gear Priorities</h2>";
  var has2=cur.slots&&(cur.slots.weapon2||cur.slots.offhand2);

/* ---------- loot filter (WraeclastArchitect extras) ---------- */
function lfText(){var n=document.getElementById("loot-filter");return n?n.textContent:"";}
function lfZip(name,text){
  var enc=new TextEncoder(),nb=enc.encode(name),db=enc.encode(text),t=[];
  for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  var crc=0xFFFFFFFF;for(var i=0;i<db.length;i++)crc=t[(crc^db[i])&255]^(crc>>>8);crc=(crc^0xFFFFFFFF)>>>0;
  var d=new Date(),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  var L=30+nb.length,C=46+nb.length,o=new Uint8Array(L+db.length+C+22),v=new DataView(o.buffer),q=0;
  function w2(x){v.setUint16(q,x,true);q+=2;}function w4(x){v.setUint32(q,x,true);q+=4;}
  w4(0x04034b50);w2(20);w2(0x0800);w2(0);w2(tm);w2(dt);w4(crc);w4(db.length);w4(db.length);w2(nb.length);w2(0);o.set(nb,q);q+=nb.length;o.set(db,q);q+=db.length;
  var cd=q;w4(0x02014b50);w2(20);w2(20);w2(0x0800);w2(0);w2(tm);w2(dt);w4(crc);w4(db.length);w4(db.length);w2(nb.length);w2(0);w2(0);w2(0);w2(0);w4(0);w4(0);o.set(nb,q);q+=nb.length;
  w4(0x06054b50);w2(0);w2(0);w2(1);w2(1);w4(C);w4(cd);w2(0);return o;
}

  var t=tab();

  document.getElementById("page").innerHTML=P[t]();
}

var page=document.getElementById("page");
page.addEventListener("change",function(e){var id=e.target.getAttribute("data-step");if(id){if(e.target.checked)S.done[id]=1;else delete S.done[id];save();render();}});
function act(el){
  var d=el.closest("[data-act],[data-stage],[data-wset],[data-slot],[data-node]");if(!d)return;
  if(d.dataset.node){S.node=d.dataset.node;}
  else if(d.dataset.slot){S.slot=d.dataset.slot;}
  else if(d.dataset.stage){S.stage=d.dataset.stage;S.slot=null;}
  else if(d.dataset.wset){S.wset=+d.dataset.wset;}
  else if(d.dataset.act==="future"){S.future=!S.future;}
  else if(d.dataset.act==="reset"){S.done={};save();}
  else if(d.dataset.act==="tree-reset"){S.nodes={};save();}
  else if(d.dataset.act==="node-toggle"){var n=(B.tree.nodes||[]).filter(function(x){return x.id===S.node;})[0];if(n){S.nodes[n.id]=!nodeOn(n);save();}}
  render();
}
page.addEventListener("click",function(e){act(e.target);});
page.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.closest(".node")){e.preventDefault();act(e.target);}});
(B.progression||[]).forEach(function(s,i){if(!s.id)s.id="s"+i;});
paintLevel();render();
})();

build/rt4U8KAQ4PQ", "site": "poebuilds.cc", "note": "3.30 level 88 gear and gems."}, {"title": "Storm Burst of Repulsion Totem Hierophant (3.28)", "url": "https://odealo.com/articles/storm-burst-totem-hierophant", "site": "Odealo", "note": "Older patch; used for Ascendancy order and gear rules."}, {"title": "Path of Exile Labyrinth Guide", "url": "https://maxroll.gg/poe/getting-started/labyrinth-guide", "site": "Maxroll", "note": "Lab levels, trial locations; page last updated 2023."}, {"title": "PoE Labyrinth and Ascendancy Guide", "url": "https://mobalytics.gg/poe/guides/labyrinth-ascendancy", "site": "Mobalytics", "note": "Recommended character levels, when to run each lab, Divine Font; updated Nov 2025."}, {"title": "Path of Exile Campaign Guide", "url": "https://maxroll.gg/poe/getting-started/campaign-guide", "site": "Maxroll", "note": "Mandatory, optional and skippable content per act; last updated 2023."}, {"title": "Quest rewards", "url": "https://poedb.tw/us/QuestRewards", "site": "poedb", "note": "Where each gem appears as a quest or vendor reward; class not shown."}, {"title": "Holy Flame Totem", "url": "https://poedb.tw/us/Holy_Flame_Totem", "site": "poedb", "note": "Quest reward and vendor for Templar."}, {"title": "ExileQuest quest and reward reference", "url": "https://exilequest.app/", "site": "ExileQuest", "note": "Siosa and Lilly Roth gem shops."}], "confidence_notes": ["This build is synthesised from several community guides and databases used as references; none of them is needed to follow it. Some pages could not be opened, so a few details come from search snippets.", "Ascendancy order for picks 2 and 4 and the unique item list come from an older 3.28 source and are unverified for 3.30.", "Lab levels 33/55/68/75 and the campaign resistance penalty are standard PoE 1 timings.", "The tree route map is schematic; node positions, Ash, Frost and Storm placement and Lightning Mastery were not verified against the 3.30 tree.", "Level numbers for Fireball, Holy Flame Totem and bandit timing are approximate.", "Storm Burst of Repulsion is a quest reward from The Siren's Cadence in Act 1 for Templar (checked on poedb, 16 Nov 2026), so the older Divine Font note is removed. Whether the Elemental Overload to crit swap still holds in 3.30 is unverified.", "Passive route: built from the 3.30 tree data. Node names, stats and distances are real; the choice of notables, their order and their levels are my reconstruction from the build's stats, not a copy of an author's tree. Levels use one point per level plus about 24 quest points by Act 10.", "Route design: community sources describe a small respec to Ancestral Bond, but their leveling tree spends points on fire-spell nodes. This guide's route spends none, so it reaches Ancestral Bond with one banked point and needs no respec (untested in play; the quest respec points from Act 2 onward are a free safety net).", "Path of Building import code is stamped for the 3.30 tree. Only the Scion code has been opened in Path of Building so far; this one has not.", "Early game checked for class access, gem level requirements and socket limits by item level. The level at which each Act 1 quest finishes is an estimate.", "Volley left out of the early Fireball group (not available to Templar in Act 1); Added Fire Damage takes its place, untested.", "Trial of Ascendancy detours sit at the area level of the area that holds the trial (Normal: Lower Prison 8, Chamber of Sins Level 2 16, Crypt Level 1 17, Crematorium 25, Catacombs 27, Imperial Gardens 30; Cruel: Prison 47, Crypt 51, Chamber of Sins Level 2 52; Merciless: Bath House 57, Tunnel 62, Ossuary 67). The bandit quest level is an estimate."], "loot_filter": {"influenced": [{"class": "Shields", "influence": "Shaper"}], "cluster_jewels": ["Medium Cluster Jewel"], "leveling_area_max": 67, "es_only_armour": true, "extra_gems": ["Assassin's Mark", "Clarity", "Frost Shield", "Frostblink"], "drop_gems": ["Automation"], "gem_aliases": {"Storm Burst of Repulsion": "Storm Burst"}}, "level_guide": [{"level": 1, "gems": ["No gem to slot yet; use your default attack until Enemy at the Gate."], "gear": ["Wear any armour that drops. Up to 3 sockets until you find item level 25 gear (late Act 2 or Act 3)."]}, {"level": 2, "gems": ["Buy {g:Fireball} and {g:Elemental Proliferation} from Nessa and link them."], "gear": [], "passives": ["Walk to, in this order: {k:Sanctity} (about level 6); {k:Discipline and Training} (about level 8). Take the small nodes on each path.", "Early points go to Life and the first Totem notables. Mind Over Matter and the other keystones come later."]}, {"level": 4, "gems": ["Take {g:Frostblink} from Breaking Some Eggs."], "gear": []}, {"level": 8, "gems": ["Take {g:Combustion} and {g:Added Fire Damage} from The Caged Brute; link {g:Combustion} to {g:Fireball}."], "gear": ["Three links is your cap until item level 25 gear."], "detour": ["Act 1: take the Trial of Ascendancy in the Lower Prison (area level 8). You need all six Normal trials, so take each one as you pass it."]}, {"level": 13, "gems": ["Add {g:Holy Flame Totem} with {g:Infused Channelling} and {g:Added Fire Damage}.", "Add {g:Shield Charge} with {g:Momentum}.", "Run {g:Clarity} for mana."], "gear": ["Equip a +1 Fire Spell gems wand ({r:Goat's Horn}) and a {r:Yew Spirit Shield} with +1 Fire Spell gems. Any similar wand and shield works."]}, {"level": 14, "gems": ["Buy {g:Faster Attacks} from Yeena and link it to {g:Shield Charge}."], "gear": [], "passives": ["Walk to, in this order: {k:Constitution} (about level 14); {k:Totemic Zeal} (about level 18); {k:Primal Manifestation} (about level 27). Take the small nodes on each path."]}, {"level": 16, "gems": [], "gear": [], "detour": ["Act 2: take the Trial of Ascendancy in the Chamber of Sins Level 2 (area level 16)."]}, {"level": 17, "gems": [], "gear": [], "detour": ["Act 2: take the Trial of Ascendancy in the Crypt Level 1 (area level 17)."]}, {"level": 22, "gems": [], "gear": [], "detour": ["Act 2: take Alira as your bandit reward (Mana, critical strike multiplier and resistances)."]}, {"level": 25, "gems": [], "gear": [], "detour": ["Act 3: take the Trial of Ascendancy in the Crematorium (area level 25)."]}, {"level": 27, "gems": [], "gear": [], "detour": ["Act 3: take the Trial of Ascendancy in the Catacombs, the side area at the Marketplace (area level 27)."]}, {"level": 28, "gems": ["Collect {g:Spell Totem} (Nessa), {g:Physical to Lightning} (Yeena) and {g:More Duration} (Clarissa, Act 3)."], "gear": ["Find a 4-linked item for Storm Burst."], "passives": ["Walk to, in this order: {k:Shaper} (about level 28); {k:Potency of Will} (about level 31); then {k:Ancestral Bond} (about level 32). Take the small nodes on each path. Keep the {k:Ancestral Bond} point unspent until the Normal Labyrinth is done: the keystone stops you dealing damage yourself, so take it in town right when you swap to Storm Burst. Then walk {k:Exceptional Performance} (about level 35)."]}, {"level": 30, "gems": [], "gear": [], "detour": ["Act 3: take the Trial of Ascendancy in the Imperial Gardens (area level 30). With all six trials held, the Aspirants' Plaza in the Sarn Encampment opens the Normal Labyrinth."]}, {"level": 33, "gems": ["After the Normal Labyrinth ({k:Pursuit of Faith}), take {k:Ancestral Bond} with your banked point and swap the main skill to {g:Storm Burst of Repulsion} linked to {g:Spell Totem}, {g:Physical to Lightning}, {g:More Duration} and {g:Infused Channelling}.", "Keep {g:Holy Flame Totem} for extra damage."], "gear": ["Put the Storm Burst group in a 4-linked item. Keep Life, Mana and resistances on every slot."], "detour": ["DIVERT TO THE NORMAL LABYRINTH: once you hold all six trials (Act 1 Lower Prison, Act 2 Chamber of Sins Level 2 and Crypt Level 1, Act 3 Crematorium, Catacombs and Imperial Gardens), take the Aspirants' Plaza plaque in the Sarn Encampment. Lab level 33 suits characters around level 28 to 35, and it gives 2 Ascendancy points. Run it before the Act 4 boss, because the build's whole plan hinges on it. In the lab take {k:Pursuit of Faith} (+1 Totem and 100% Totem duration and placement speed), then step out to town, spend your banked point on {k:Ancestral Bond} so your totems, not you, deal the damage, and slot {g:Storm Burst of Repulsion} as the main skill. No respec is needed."], "passives": ["{k:Ancestral Bond} (keystone): +1 maximum Totems, and you can't deal damage with skills yourself, so your Totems do all the damage. The route already runs next to it and spends nothing on fire-spell nodes, so no respec or refund is needed: take it in town right after the lab, then swap the gems."]}, {"level": 36, "gems": [], "gear": [], "passives": ["Walk to, in this order: {k:Mind Over Matter} (keystone) (about level 39); {k:Enduring Bond} (about level 42); {k:Shaman's Dominion} (about level 45). Take the small nodes on each path."]}, {"level": 45, "gems": ["Add {g:Conductivity} and {g:Elemental Weakness} in your gloves as curses."], "gear": ["Make sure your gloves have a socket group for the curses; Physical converted to Lightning on gloves helps later."]}, {"level": 46, "gems": [], "gear": [], "passives": ["Walk to, in this order: {k:Divine Wrath} (about level 48); {k:Arcanist's Dominion} (about level 48); {k:Heart and Soul} (about level 50); {k:Crackling Speed} (about level 53); {k:Lightning Walker} (about level 54). Take the small nodes on each path."]}, {"level": 47, "gems": [], "gear": [], "detour": ["Act 6: take the Cruel trial in the Prison (area level 47)."]}, {"level": 50, "gems": [], "gear": ["Cap elemental resistances on every slot while stacking Life and Mana, and start watching Chaos Resistance."]}, {"level": 51, "gems": [], "gear": [], "detour": ["Act 7: take the Cruel trial in the Crypt (area level 51)."]}, {"level": 52, "gems": [], "gear": [], "detour": ["Act 7: take the Cruel trial in the Chamber of Sins Level 2 (area level 52)."]}, {"level": 55, "gems": [], "gear": [], "detour": ["DIVERT TO THE CRUEL LABYRINTH: after the third Cruel trial (Act 6 Lower Prison, Act 7 Crypt Level 1, Act 7 Chamber of Sins Level 2), or when you reach the Act 8 town. Lab level 55 suits characters at level 50 to 55. It gives 2 more Ascendancy points; take {k:Ritual of Awakening} here (unverified for 3.30, so read the node text in game before committing)."]}, {"level": 56, "gems": [], "gear": [], "passives": ["Walk to, in this order: {k:Storm Weaver} (about level 58); {k:Iron Will} (keystone) (about level 59); {k:Enigmatic Reach} (about level 63); {k:Arcane Potency} (about level 65); {k:Annihilation} (about level 68); {k:Magebane} (keystone) (about level 69). Take the small nodes on each path."]}, {"level": 57, "gems": [], "gear": [], "detour": ["Act 8: take the Merciless trial in the Bath House (area level 57)."]}, {"level": 60, "gems": [], "gear": ["Refill every resistance to cap after the campaign penalty before you enter maps."]}, {"level": 62, "gems": [], "gear": [], "detour": ["Act 9: take the Merciless trial in the Tunnel (area level 62)."]}, {"level": 65, "gems": [], "gear": []}, {"level": 67, "gems": [], "gear": [], "detour": ["Act 10: take the Merciless trial in the Ossuary (area level 67), before the Act 10 boss. All three Merciless trials must be done before the lab opens."]}, {"level": 68, "gems": [], "gear": [], "detour": ["DIVERT TO THE MERCILESS LABYRINTH: after the Ossuary trial and before the Act 10 boss. Lab level 68, typical character level 65 to 70. 2 more points: {k:Arcane Blessing}."]}, {"level": 70, "gems": ["Add {g:Increased Critical Strikes} and {g:Increased Critical Damage} to {g:Storm Burst of Repulsion} in your body armour.", "Swap {g:Elemental Weakness} for {g:Assassin's Mark}.", "Add {g:Wrath} with {g:Eternal Blessing} on the weapon swap and {g:Arcane Cloak} with {g:Automation}, {g:More Duration} and {g:Efficacy} in your boots.", "Put quality on {g:Storm Burst of Repulsion} first: it raises base Duration and explosion damage."], "gear": ["Look for a body armour with enough links for the crit setup."], "passives": ["The route is done. Spend the remaining points on Life, Mana, spell block and Strength and Intelligence nodes next to your jewel sockets."]}, {"level": 72, "gems": [], "gear": ["Move to the Early Maps gear stage: a Shaper shield with +1 maximum Totems, an {u:Ashes of the Stars} amulet, a rare wand with Spell Damage and Cast Speed, and a {u:Timeclasp} ring if budget allows."]}, {"level": 75, "gems": [], "gear": [], "detour": ["ETERNAL LABYRINTH (after the campaign): it has no campaign trials. It needs an Offering to the Goddess, usually dropped by a Labyrinth Trial in a Tier 6 or higher map. Lab level 75. 2 more points: {k:Conviction of Power}. Run it when you have the Offering, not before."]}, {"level": 85, "gems": ["Move into the {u:Soul Mantle} 6-link: {g:More Duration}, {g:Lightning Penetration}, {g:Increased Critical Damage}, {g:Infused Channelling} and {g:Inspiration}; Soul Mantle supplies {g:Spell Totem}."], "gear": ["Move to the Endgame gear stage: {u:Soul Mantle}, a crit wand, and Exarch and Eater implicits. Mageblood is the late goal."]}], "campaign": [{"act": 1, "levels": "Levels 1 to 13", "mandatory": ["The Hillock", "Mud Flats glyphs (opens Submerged Passage)", "Brutus in the Upper Prison (opens Prisoner's Gate)", "Ship Graveyard (Allflame and Fairgraves)", "Merveil in the Cavern of Anger"], "worth": ["Enemy at the Gate, Breaking Some Eggs, The Caged Brute and The Siren's Cadence: skill gem rewards", "Dweller of the Deep and The Marooned Mariner: a passive point each", "A Dirty Job: 2 passive respec points", "Lord's Labyrinth: Trial of Ascendancy in the Lower Prison"], "skip": ["Fire Fury, Kuduku, Ironpoint, the Faun, Chatters, Ungulath, Burning Menace, Stranglecharm, Amarissa, Ambrosia, the Hailrake fight and most Coast and Ledge enemies"], "lab": "Trial 1 of 6: Lower Prison"}, {"act": 2, "levels": "Levels 13 to 23", "mandatory": ["Crossroads and Riverways", "Western Forest (Captain Arteri, Ancient Seal path)", "The Weaver (drops Maligaro's Spike)", "Vaal Ruins and the Vaal Oversoul", "Deal with the Bandits (The Apex, needed to enter the Pyramid)"], "worth": ["Sharp and Cruel, Intruders in Black: skill gem rewards", "The Way Forward: a passive point", "Kill all three bandits: 2 passive points", "Through Sacred Ground: 2 passive respec points", "Lord's Labyrinth: two Trials of Ascendancy"], "skip": ["Calaf, Gneiss, Bravalo, Soulmourn, Targa, Seleslatha, Q'uru, Archbishop Geofri, and the Fellshrine Ruins (unless you need the Trial)"], "lab": "Trials 2 and 3 of 6: Chamber of Sins Level 2 and The Crypt Level 1"}, {"act": 3, "levels": "Levels 23 to 33", "mandatory": ["Guard Captain and Lost in Love (opens the Sewers)", "Piety in the Crematorium", "Ribbon Spool in the Battlefront", "Thaumetic Sulphite in the Docks", "Infernal Talc in the Solaris Temple", "Lunaris Temple and Piety", "Sceptre of God and Dominus (final boss)"], "worth": ["Lost in Love, Sever the Right Hand: skill gem rewards", "A Fixture of Fate (the Library): support gems, and Siosa's gem shop", "Victario's Secrets: a passive point and 2 respec points", "Piety's Pets: a passive point", "Lord's Labyrinth: three Trials of Ascendancy"], "skip": ["Perpetus, Hatebeat, Captain Aurelianus, Shipyard Terror, Goddess of Purity, Kole, Fleshrend, Spinecrack, Tyrannursus, Thistlesage, Conqueror Wurm, Caliga, Paradisae Venenum, Trinian and A Swig of Hope"], "lab": "Trials 4 to 6 of 6: The Crematorium, The Catacombs, The Imperial Gardens. Then run the Normal Labyrinth."}, {"act": 4, "levels": "Levels 33 to 40", "mandatory": ["Voll (Deshret's Banner opens the Mines)", "Kaom and King Kaom (Eye of Fury)", "Daresso and the Grand Arena (Eye of Desire)", "Belly of the Beast", "Piety, the Abomination", "The Harvest (Maligaro, Shavronne, Doedre for Malachai's organs)", "Malachai"], "worth": ["Breaking the Seal, The King of Desire, The Eternal Nightmare: skill gem rewards", "An Indomitable Spirit: a passive point and 2 respec points"], "skip": ["Hundred Foot Shadow, Pikerivet, Hammerstorm, Voidscream, Torchoak Grove, Triskeriaki, Eyepecker, Steelchaw, The Bone Queen, The Burning Man and The White Death"]}, {"act": 5, "levels": "Levels 40 to 45", "mandatory": ["Overseer Krow (Return to Oriath)", "Justicar Casticus (Eyes of Zeal)", "High Templar Avarius and Innocence", "The Ossuary (The Ravenous God)", "Kitava"], "worth": ["In Service to Science: a passive point", "Kitava's Torments: a passive point and 2 respec points", "Death to Purity and The King's Feast: jewel rewards"], "skip": ["The Matriarch, Cato, The Risen Matriarch, Utula (optional kill, but gives a jewel choice) and the Stately Hideout"]}, {"act": 6, "levels": "Levels 45 to 52", "mandatory": ["Karui Fortress and Tukohama (The Father of War)", "Shavronne's Tower and Brutus (Essence of Umbra)", "Brine King's Reef and Tsoagoth"], "worth": ["Fallen from Grace: 2 respec points and unlocks Lilly Roth's gem shop", "The Father of War, The Cloven One, The Puppet Mistress: a passive point each", "Lord's Labyrinth: the Cruel Trial in the Lower Prison"], "skip": ["Rhys of Abram (except for the Fallen from Grace reward), Raihara, Riptide, Dishonoured Queen (except for the Eye of Conquest), Fleetfreak, Defiled Proclamation, The Animal Pack, Hollowskull and Brinecrack"], "lab": "Cruel trial 1 of 3: Lower Prison"}, {"act": 7, "levels": "Levels 52 to 58", "mandatory": ["Greust (route to the Northern Forest)", "Gruthkul (Lighting the Way, route to the Causeway)", "Arakaali (final boss)", "The Temple of Decay path through Yeena"], "worth": ["The Master of a Million Faces, Queen of Despair and Kishara's Star: a passive point each (Kishara's Star also gives 2 respec points)", "Lord's Labyrinth: two Cruel Trials"], "skip": ["Bundle of Woe, Plague Retch, Tunnelworm, The Dreadstone, The Bone Sculptor, The Great White Bones and Blightblade. Maligaro's Sanctum is not skippable: it drops the Black Venom for the Chamber of Sins Level 2 key."], "lab": "Cruel trials 2 and 3 of 3: The Crypt Level 1 and Chamber of Sins Level 2. Then run the Cruel Labyrinth."}, {"act": 8, "levels": "Levels 58 to 63", "mandatory": ["Doedre the Vile (Essence of the Hag)", "Tolman and the Quay", "Dawn (Solar Eclipse, Sun Orb) and Dusk (Lunar Eclipse, Moon Orb)", "Solaris and Lunaris (final boss)"], "worth": ["Love is Dead: a passive point and 2 respec points", "The Gemling Legion and Reflection of Terror: a passive point each", "Lord's Labyrinth: the Merciless Trial in the Bath House"], "skip": ["Lingering Abberation, Effigy of Fear, Ondar, Regulus, Nightbringer Lucius and the Solaris Concourse"], "lab": "Merciless trial 1 of 3: The Bath House"}, {"act": 9, "levels": "Levels 63 to 67", "mandatory": ["The Storm Blade and Bottled Storm (opens the Oasis)", "Shakari (Queen of the Sands)", "Garukhan and Kira (The Ruler of Highgate)", "General Adus (Trarthan Powder)", "Doedre Darksoul, Maligaro the Broken and Shavronne Unbound", "The Depraved Trinity (final boss)"], "worth": ["Queen of the Sands and The Ruler of Highgate: a passive point each", "Fastis Fortuna: 2 respec points", "Lord's Labyrinth: the Merciless Trial in the Tunnels"], "skip": ["Hundred Foot Shadow, Boulderback, Droolmaw, the Basilisk, the Forbidden Vault and the Desert Hideout"], "lab": "Merciless trial 2 of 3: The Tunnels"}, {"act": 10, "levels": "Levels 67 to 70", "mandatory": ["Plaguewing (frees Bannon)", "The Torched Courts and Innocence route", "Vilenta"], "worth": ["Vilenta's Vengeance: a passive point", "Safe Passage and An End to Hunger: quest rewards", "Lord's Labyrinth: the Merciless Trial in the Ossuary"], "skip": ["The Reliquary. The source I used ended after Vilenta, so check the rest of Act 10 in game."], "lab": "Merciless trial 3 of 3: The Ossuary, then run the Merciless Labyrinth before the Act 10 boss."}], "campaign_note": "Act ranges are approximate and match the area levels you will see. Mandatory means required to progress or to open the next area. The lists come from community campaign references that may date from 2023, so check any act that looks different in game. Passive point rewards add up over the campaign; resistances take a -30% penalty after Act 5 and again after Act 10.", "gem_sources": {"intro": "Gems come from quest rewards or from vendors that unlock after a quest. The shortcut: Lilly Roth in the Act 6 town (after Fallen from Grace) sells almost every non-drop gem to any class, so anything you missed earlier can be bought there. Vendors named below: Nessa (Act 1), Yeena (Act 2), Clarissa and Siosa (Act 3), Lilly Roth (Act 6 and 10).", "rows": [{"gem": "Fireball", "act": 1, "source": "Enemy at the Gate, Nessa (vendor)", "level": "Level 2", "conf": "Confirmed"}, {"gem": "Elemental Proliferation", "act": 1, "source": "Enemy at the Gate or Mercy Mission, Nessa (vendor); also a Mercy Mission reward", "level": "Level 2", "conf": "Confirmed"}, {"gem": "Holy Flame Totem", "act": 1, "source": "Quest reward: Breaking Some Eggs (Nessa also sells it)", "level": "Level 4 and up", "conf": "Confirmed"}, {"gem": "Frostblink", "act": 1, "source": "Breaking Some Eggs, reward or Nessa", "level": "Level 4", "conf": "Confirmed"}, {"gem": "Shield Charge", "act": 1, "source": "Breaking Some Eggs, reward or Nessa", "level": "Level 4 and up", "conf": "Confirmed"}, {"gem": "Infused Channelling, Momentum", "act": 1, "source": "Mercy Mission, Nessa (Infused Channelling is also a reward)", "level": "Level 4 and up", "conf": "Confirmed"}, {"gem": "Combustion, Added Fire Damage", "act": 1, "source": "The Caged Brute, reward or Nessa", "level": "Level 8", "conf": "Confirmed"}, {"gem": "Spell Totem", "act": 1, "source": "The Caged Brute, Nessa (vendor)", "level": "Level 8", "conf": "Confirmed"}, {"gem": "Clarity", "act": 1, "source": "The Caged Brute, reward or Nessa", "level": "Level 10", "conf": "Confirmed"}, {"gem": "Storm Burst of Repulsion", "act": 1, "source": "Quest reward: The Siren's Cadence (Act 1, after Merveil). Templar is listed for this reward and Nessa also offers it. The gem needs level 12 and gives 1 to 20 gem levels up to character level 70.", "level": "Level 12", "conf": "Templar confirmed"}, {"gem": "Faster Attacks", "act": 2, "source": "Sharp and Cruel, Yeena (vendor)", "level": "Level 8 and up", "conf": "Confirmed"}, {"gem": "Physical to Lightning", "act": 2, "source": "Sharp and Cruel, Yeena (vendor)", "level": "Level 18", "conf": "Confirmed"}, {"gem": "Inspiration, Arcane Cloak, Physical to Lightning", "act": 2, "source": "Intruders in Black or The Root of the Problem reward lists", "level": "Level 13 to 23", "conf": "Listed as a reward, class not confirmed"}, {"gem": "Increased Critical Damage, Efficacy", "act": 2, "source": "Sharp and Cruel or The Root of the Problem reward lists", "level": "Level 13 to 23", "conf": "Listed as a reward, class not confirmed"}, {"gem": "More Duration", "act": 3, "source": "A Fixture of Fate, Clarissa (vendor)", "level": "Level 31", "conf": "Confirmed"}, {"gem": "Assassin's Mark, Conductivity, Elemental Weakness, Wrath", "act": 3, "source": "Lost in Love and the Act 3 reward list", "level": "Level 23 to 33", "conf": "Listed as a reward, class not confirmed"}, {"gem": "Eternal Blessing", "act": 4, "source": "The Eternal Nightmare", "level": "Level 33 to 40", "conf": "Listed as a reward, class not confirmed"}, {"gem": "Frost Shield", "act": 4, "source": "Breaking the Seal", "level": "Level 33 to 40", "conf": "Listed as a reward, class not confirmed"}, {"gem": "Lightning Penetration", "act": 0, "source": "Not individually checked", "level": "Level 33 and up", "conf": "Class not confirmed"}], "note": "Anything you miss can be bought from Lilly Roth in the Act 6 town. Check Automation (Arcane Cloak link, level 70) in game."}, "pob_code": "eJztWd9z2zYS_lcweGpn9mz8BulK6jiO5WQmyblRenm8gciVxTEIuAToVP99B5R1rpNeni52Ls2LBlqAu4vdb4H9yNnPv_ee3OKQuhjmlB8xSjA0se3C1Zz--m75j4r-vJhdurz95-bZ2PkysZhNI-LxFv2ccsYoyW64wvyvgyL5b <script>
(function(){
"use strict";
var B=JSON.parse(document.getElementById("build-data").textContent);
var M=B.meta||{}, MAX=M.max_level||100, KEY="wa:"+(M.slug||M.title||"build");
var S={level:1,done:{},nodes:{},stage:null,slot:null,node:null,wset:1,future:true};
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null"); if(sv){S.level=sv.level||1;S.done=sv.done||{};S.nodes=sv.nodes||{};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({level:S.level,done:S.done,nodes:S.nodes}));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
/* {g:Gem} {u:Unique} {r:Rare} {m:Magic} {k:Keystone/Notable} {c:Currency} */
function fmt(s){return esc(s).replace(/\{([gurmkc]):([^}]+)\}/g,'<span class="t-$1">$2</span>');}
function list(a,cls){return a&&a.length?'<ul class="plain '+(cls||"")+'">'+a.map(function(x){return"<li>"+fmt(x)+"</li>";}).join("")+"</ul>":"";}
function box(title,inner){return inner?'<section class="box">'+(title?"<h3>"+esc(title)+"</h3>":"")+inner+"</section>":"";}
function link(u,t){return /^https:\/\//.test(u||"")?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t||u)+"</a>":"";}
function isPoe2(){return M.game==="poe2";}

var TABS=[["overview","Overview"],["leveling","Leveling"],["tree","Passive Tree"],["gems","Gems"],["gear","Gear"],["layers","Layers"],["playstyle","Playstyle"],["filter","Loot Filter"],["sources","Sources"]];

/* ---------- hero ---------- */
(function(){
  var h="";
  if(M.sample)h+='<div class="banner">Sample layout. The build data on this page is placeholder content and has not been verified against the live game.</div>';
  h+='<span class="lbl">'+esc(isPoe2()?"Path of Exile 2":"Path of Exile")+" build blueprint</span>";
  h+="<h1>"+esc(M.title)+"</h1>";
  if(M.summary)h+='<p style="max-width:68ch">'+fmt(M.summary)+"</p>";
  var c=[["Class",[M.class,M.ascendancy].filter(Boolean).join(" / ")],["Goal",M.objective],["League",M.league],["Patch",M.patch],["Verified",M.verified_on]];
  h+='<div class="chips">'+c.filter(function(x){return x[1];}).map(function(x){return'<span class="chip">'+x[0]+" <b>"+esc(x[1])+"</b></span>";}).join("")+"</div>";
  h+='<div class="grades">'+(B.ratings||[]).map(function(r){var g=esc(String(r.grade||"").charAt(0).toUpperCase());return'<div class="grade"><span class="g g'+g+'">'+g+'</span><span><span class="lbl">'+esc(r.vector)+"</span></span></div>";}).join("")+"</div>";
  h+='<p><a class="dl" href="#filter">Loot filter for this build</a></p>';document.getElementById("hero").innerHTML=h;
  document.getElementById("foot").innerHTML="Fan-made guide generated by WraeclastArchitect. Not affiliated with Grinding Gear Games. Icons are original illustrations, not game art. Progress on this page is saved in this browser only.";
})();

/* ---------- level control ---------- */
var range=document.getElementById("lv-range"); range.max=MAX;
function stages(){return (B.gear&&B.gear.stages)||[];}
function stageAt(lv){var st=stages(),cur=st[0]||null;st.forEach(function(s){if((s.from_level||1)<=lv)cur=s;});return cur;}
function setLevel(v){S.level=Math.max(1,Math.min(MAX,v|0));S.stage=null;save();paintLevel();render();}
function paintLevel(){range.value=S.level;document.getElementById("lv-num").textContent=S.level;var s=stageAt(S.level);document.getElementById("lv-stage").textContent=s?s.name:"";}
range.addEventListener("input",function(){setLevel(+range.value);});
document.getElementById("lv-down").addEventListener("click",function(){setLevel(S.level-1);});
document.getElementById("lv-up").addEventListener("click",function(){setLevel(S.level+1);});

/* ---------- pages ---------- */
var P={};
P.overview=function(){
  var o=B.overview||{},h="<h2>Overview and Vector Evaluation</h2>";
  h+='<div class="scroll"><table><thead><tr><th>Vector</th><th>Grade</th><th>Why</th></tr></thead><tbody>'+(B.ratings||[]).map(function(r){var g=esc(String(r.grade||"").charAt(0).toUpperCase());return"<tr><td>"+esc(r.vector)+'</td><td><span class="g'+g+'" style="font-family:var(--display);font-size:1.3rem">'+g+"</span></td><td>"+fmt(r.why)+"</td></tr>";}).join("")+"</tbody></table></div>";
  h+='<div class="cols">'+box("Why this build",list(o.why))+box("Strengths",list(o.strengths,"plus"))+box("Weaknesses",list(o.weaknesses,"minus"))+box("Assumptions",list(M.assumptions))+"</div>";
  return h;
};
P.leveling=function(){
  var st=(B.progression||[]).slice().sort(function(a,b){return a.level-b.level;});
  var due=st.filter(function(s){return s.level<=S.level;}), dn=due.filter(function(s){return S.done[s.id];}).length;
  var nextIdx=-1; st.some(function(s,i){if(!S.done[s.id]){nextIdx=i;return true;}});
  var h="<h2>Leveling Checklist</h2>";
  h+='<p class="muted">Set your character level in the bar above. Steps up to that level are due, later steps are dimmed. Tick each step as you finish it.</p>';
  h+='<div class="tools"><span>'+dn+" of "+due.length+" due steps done</span>"+'<button class="btn" data-act="future" aria-pressed="'+S.future+'">Show later steps</button><button class="btn" data-act="reset">Clear ticks</button></div>';
  h+='<div class="prog"><i style="width:'+(due.length?Math.round(dn/due.length*100):0)+'%"></i></div><div class="steps">';
  st.forEach(function(s,i){
    var fut=s.level>S.level; if(fut&&!S.future)return;
    h+='<label class="srow'+(S.done[s.id]?" done":"")+(fut?" future":"")+(i===nextIdx&&!fut?" next":"")+'"><input type="checkbox" id="st-'+esc(s.id)+'" data-step="'+esc(s.id)+'"'+(S.done[s.id]?" checked":"")+'><span class="at">'+s.level+'</span><span class="tx"><b>'+fmt(s.title)+'</b> <span class="pill">'+esc(s.type||"step")+"</span>"+(s.detail?'<br><span class="muted">'+fmt(s.detail)+"</span>":"")+"</span></label>";
  });
  return h+"</div>";
};
function nodeOn(n){return S.nodes[n.id]!=null?S.nodes[n.id]:(n.level||1)<=S.level;}
P.tree=function(){
  var T=B.tree||{},N=T.nodes||[],byId={},h="<h2>Passive Tree and Ascendancy</h2>";
  N.forEach(function(n,i){byId[n.id]=n;if(n.x==null){var row=Math.floor(i/7),col=i%7;n.x=8+(row%2?6-col:col)*14;n.y=8+row*13;}});
  var pts=N.filter(nodeOn).reduce(function(a,n){return a+(n.points||0);},0), tot=N.reduce(function(a,n){return a+(n.points||0);},0);
  h+='<p class="muted">Route map of the build\'s path through the tree, in the order to take it. It follows your character level. Select a node for details, or mark it taken yourself. This is a schematic of the route, not the full in-game tree.'+(M.planner_url?" "+link(M.planner_url,"Open the full tree planner")+".":"")+"</p>";
  h+='<div class="tools"><span><b>'+pts+"</b> of "+tot+" route points allocated at level "+S.level+'</span><button class="btn" data-act="tree-reset">Follow level again</button></div>';
  var W=1000,H=Math.max(300,Math.max.apply(null,N.map(function(n){return n.y;}).concat([20]))*10+70),svg="";
  (T.edges||[]).forEach(function(e){var a=byId[e[0]],b=byId[e[1]];if(a&&b)svg+='<line class="edge'+(nodeOn(a)&&nodeOn(b)?" on":"")+'" x1="'+a.x*10+'" y1="'+a.y*10+'" x2="'+b.x*10+'" y2="'+b.y*10+'"/>';});
  N.forEach(function(n){
    var x=n.x*10,y=n.y*10,k=n.kind||"travel",sh;
    if(k==="keystone")sh='<rect class="shape" x="'+(x-17)+'" y="'+(y-17)+'" width="34" height="34" transform="rotate(45 '+x+" "+y+')"/>';
    else if(k==="jewel")sh='<rect class="shape" x="'+(x-13)+'" y="'+(y-13)+'" width="26" height="26"/>';
    else if(k==="ascendancy")sh='<polygon class="shape" points="'+[0,1,2,3,4,5].map(function(i){var a=Math.PI/3*i;return (x+20*Math.cos(a)).toFixed(1)+","+(y+20*Math.sin(a)).toFixed(1);}).join(" ")+'"/>';
    else sh='<circle class="shape" cx="'+x+'" cy="'+y+'" r="'+(k==="start"?24:k==="notable"?16:k==="mastery"?13:9)+'"/>';
    svg+='<g class="node'+(nodeOn(n)?" on":"")+(S.node===n.id?" sel":"")+'" data-node="'+esc(n.id)+'" tabindex="0" role="button" aria-label="'+esc(n.name)+'">'+sh+(k!=="travel"?'<text x="'+x+'" y="'+(y+42)+'">'+esc(n.name)+"</text>":"")+"</g>";
  });
  var sel=byId[S.node],side;
  if(sel)side='<span class="lbl">'+esc(sel.kind||"travel")+"</span><h3>"+esc(sel.name)+'</h3><p>Take by level <b>'+(sel.level||1)+"</b>"+(sel.points?" &middot; "+sel.points+" point"+(sel.points>1?"s":""):"")+"</p>"+(sel.note?"<p>"+fmt(sel.note)+"</p>":"")+'<button class="btn" data-act="node-toggle" aria-pressed="'+nodeOn(sel)+'">'+(nodeOn(sel)?"Taken. Mark as not taken":"Mark as taken")+"</button>";
  else side='<p class="muted">Select a node on the map to see when to take it and why.</p>';
  h+='<div class="treewrap"><div class="tree scroll"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Passive tree route map">'+svg+'</svg></div><aside class="box">'+side+"</aside></div>";
  h+='<div class="legend"><span>Large circle: class start</span><span>Circle: notable</span><span>Diamond: keystone</span><span>Square: jewel socket</span><span>Hexagon: Ascendancy</span><span>Small dot: travel nodes</span></div>';
  var asc=T.ascendancy||[];
  if(asc.length)h+='<h3>Ascendancy order</h3><div class="scroll"><table><thead><tr><th>#</th><th>Node</th><th>When</th><th>Why</th></tr></thead><tbody>'+asc.map(function(a,i){return"<tr><td>"+(i+1)+'</td><td class="t-k">'+esc(a.name)+"</td><td>"+esc(a.when||"")+"</td><td>"+fmt(a.why)+"</td></tr>";}).join("")+"</tbody></table></div>";
  function named(a){return list((a||[]).map(function(k){return"{k:"+k.name+"}"+(k.why?": "+k.why:"");}));}
  h+='<div class="cols">'+box("Keystones",named(T.keystones))+box(isPoe2()?"Jewels":"Cluster, Timeless and other Jewels",named(T.jewels))+box(isPoe2()?"Weapon set specialization":"Masteries",named(isPoe2()?T.weapon_sets:T.masteries))+box("Notes",list(T.notes))+"</div>";
  return h;
};
P.gems=function(){
  var G=B.gems||{},h="<h2>Gems and Links</h2>";
  h+='<p class="muted">Setups active at level '+S.level+" are shown in full. Earlier and later setups are dimmed. "+(isPoe2()?"Persistent buffs reserve Spirit.":"Auras reserve Mana.")+"</p>";
  h+='<div class="cols">'+(G.setups||[]).map(function(s){
    var a=(s.from_level||1)<=S.level&&S.level<=(s.to_level||MAX);
    return'<div class="setup'+(a?"":" off")+'"><div class="tools"><h3>'+esc(s.name)+'</h3><span class="pill'+(a?" now":"")+'">'+(a?"Active now":"Lv "+(s.from_level||1)+"\u2013"+(s.to_level||MAX))+"</span></div>"+
      '<span class="lbl">'+esc([s.role,s.slot].filter(Boolean).join(" \u00b7 "))+"</span>"+
      '<div class="sockets"><span class="sock main">'+esc(s.skill)+"</span>"+(s.supports||[]).map(function(x){return'<span class="link"></span><span class="sock sup" title="'+esc(x.note||"")+'">'+esc(x.name||x)+"</span>";}).join("")+"</div>"+
      (s.reservation?'<p><span class="lbl">'+(isPoe2()?"Spirit":"Reservation")+"</span> "+esc(s.reservation)+"</p>":"")+(s.note?'<p class="muted">'+fmt(s.note)+"</p>":"")+"</div>";
  }).join("")+"</div>";
  h+='<div class="cols">'+box(isPoe2()?"Uncut Gem priority":"Gem acquisition",list(G.priority))+box("Notes",list(G.notes))+"</div>";
  return h;
};
var ICON={weapon:'<path d="M22 4 26 8 12 22 8 22 8 18Z"/><path d="M6 20 10 24M5 27 9 23"/>',offhand:'<path d="M15 4 25 8V15C25 21 21 25 15 27 9 25 5 21 5 15V8Z"/>',helmet:'<path d="M6 22V14A9 9 0 0 1 24 14V22H18V16H12V22Z"/>',body:'<path d="M9 5 15 8 21 5 26 10 22 13V26H8V13L4 10Z"/>',gloves:'<path d="M9 26V14L7 9 10 8 12 12V5H15V12 4H18V12 6H21V16L23 13 25 15 21 22V26Z"/>',boots:'<path d="M10 4H17V17L25 21V26H8V20L10 17Z"/>',belt:'<rect x="3" y="11" width="24" height="8"/><rect x="12" y="9" width="6" height="12"/>',amulet:'<path d="M7 4C7 14 23 14 23 4"/><path d="M15 12 19 18 15 26 11 18Z"/>',ring:'<circle cx="15" cy="18" r="7"/><path d="M12 9 15 5 18 9 15 12Z"/>'};
function ico(k){return'<svg viewBox="0 0 30 30" aria-hidden="true">'+(ICON[k.replace(/\d+$/,"")]||ICON.ring)+"</svg>";}
var SLOTS=[["weapon","Weapon"],["helmet","Helmet"],["amulet","Amulet"],["offhand","Off-hand"],["body","Body Armour"],["ring1","Ring"],["ring2","Ring"],["gloves","Gloves"],["belt","Belt"],["boots","Boots"]];
P.gear=function(){

function lfZip(name,text){
  var enc=new TextEncoder(),nb=enc.encode(name),db=enc.encode(text),t=[];
  for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}
  var crc=0xFFFFFFFF;for(var i=0;i<db.length;i++)crc=t[(crc^db[i])&255]^(crc>>>8);crc=(crc^0xFFFFFFFF)>>>0;
  var d=new Date(),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  var L=30+nb.length,C=46+nb.length,o=new Uint8Array(L+db.length+C+22),v=new DataView(o.buffer),q=0;
  function w2(x){v.setUint16(q,x,true);q+=2;}function w4(x){v.setUint32(q,x,true);q+=4;}
  w4(0x04034b50);w2(20);w2(0x0800);w2(0);w2(tm);w2(dt);w4(crc);w4(db.length);w4(db.length);w2(nb.length);w2(0);o.set(nb,q);q+=nb.length;o.set(db,q);q+=db.length;
  var cd=q;w4(0x02014b50);w2(20);w2(20);w2(0x0800);w2(0);w2(tm);w2(dt);w4(crc);w4(db.length);w4(db.length);w2(nb.length);w2(0);w2(0);w2(0);w2(0);w4(0);w4(0);o.set(nb,q);q+=nb.length;
  w4(0x06054b50);w2(0);w2(0);w2(1);w2(1);w4(C);w4(cd);w2(0);return o;
}

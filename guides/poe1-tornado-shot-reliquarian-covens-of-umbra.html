<style>
/* Layout: sticky command bar (build name, level dial, tabs) over one content column; each tab is a page.
   Dark-first: obsidian and tarnished bronze, with the in-game rarity colours carrying item meaning. */
:root{
  color-scheme:dark;
  --bg:#0c0a09; --panel:#161210; --panel2:#1e1815; --line:#3a2e24; --line2:#5a4634;
  --fg:#d9cdb8; --dim:#9a8b76; --head:#e8d5a8; --accent:#c8a45c; --accent-ink:#1a1206; --ember:#b5482a;
  --normal:#c8c8c8; --magic:#8f8fff; --rare:#f2e96b; --unique:#d9783a; --gem:#2fc4b4; --cur:#b8a983; --key:#e8d5a8;
  --ok:#7fb069; --warn:#e0a53a; --bad:#d9573f;
  --gS:#e0a53a; --gA:#7fb069; --gB:#6f9fd8; --gC:#9a8b76;
  --display:"Marcellus SC","Palatino Linotype",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ece3d0; --panel:#f6efdf; --panel2:#e4d8bf; --line:#c9b995; --line2:#a08a62;
  --fg:#2c2319; --dim:#6b5b45; --head:#4a2f12; --accent:#8a5a1c; --accent-ink:#fff6e2; --ember:#a33a1e;
  --normal:#4a4a4a; --magic:#3b3bc4; --rare:#8a6d00; --unique:#a8480f; --gem:#0f7f74; --cur:#6f6040; --key:#4a2f12;
  --ok:#3f7a2c; --warn:#9a6a00; --bad:#b23a22;
  --gS:#9a6a00; --gA:#3f7a2c; --gB:#2f5fa8; --gC:#6b5b45;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

h1{font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.1}
h2{font-size:1.45rem;border-bottom:1px solid var(--line);padding-bottom:6px}

a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}

.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.t-g{color:var(--gem)}.t-u{color:var(--unique)}.t-r{color:var(--rare)}.t-m{color:var(--magic)}.t-k{color:var(--key);font-family:var(--display)}.t-c{color:var(--cur)}
.t-g,.t-u,.t-r,.t-m,.t-c{font-weight:500}

/* hero */
.hero{padding-block:22px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--bg))}
.hero .wrap{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);padding:1px 9px;font-size:.82rem;color:var(--dim);background:var(--panel)}
.chip b{color:var(--fg);font-weight:500}
.banner{border:1px solid var(--warn);color:var(--warn);padding:6px 10px;font-size:.9rem;background:var(--panel)}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grade{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:8px 10px;min-width:0}
.grade .g{font-family:var(--display);font-size:1.9rem;line-height:1;width:1.2em;text-align:center}
.gS{color:var(--gS)}.gA{color:var(--gA)}.gB{color:var(--gB)}.gC{color:var(--gC)}
@media (max-width:640px){.grades{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* command bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line2)}
.bar .wrap{display:flex;flex-direction:column;gap:6px;padding-block:8px 0}
.level{display:flex;align-items:center;gap:10px}
.level .stage{white-space:nowrap}
.level .step{flex:none}

.level input[type=range]{flex:1 1 0;min-width:0;accent-color:var(--accent)}
.lv{font-family:var(--display);font-size:1.5rem;color:var(--head);min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.step{width:30px;height:30px;border:1px solid var(--line2);background:var(--panel2);line-height:1}
.stage{font-size:.85rem;color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}

.tabs a:hover{color:var(--fg)}

main{padding-block:22px 48px}
.page{display:flex;flex-direction:column;gap:18px}

ul.plain li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;background:var(--accent);transform:rotate(45deg)}
ul.plus li::before{background:var(--ok)} ul.minus li::before{background:var(--bad)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}

.muted{color:var(--dim)}

.pill{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;padding:0 7px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.pill.now{border-color:var(--accent);color:var(--accent)}
.pill.must{border-color:var(--ember);color:var(--ember)}

/* leveling checklist */
.prog{height:6px;background:var(--panel2);border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent)}
.steps{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:auto 3.2em minmax(0,1fr);gap:10px;align-items:start;padding:9px 6px;border-bottom:1px solid var(--line)}
.srow input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.srow .at{font-family:var(--display);color:var(--head);font-variant-numeric:tabular-nums}
.srow.done .tx{text-decoration:line-through;opacity:.5}
.srow.future{opacity:.45}
.srow.next{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:var(--panel2);padding:4px 12px}

.btn[aria-pressed="true"] .muted{color:inherit;opacity:.75}

/* tree map */
.treewrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
@media (max-width:820px){.treewrap{grid-template-columns:minmax(0,1fr)}}
.tree{background:radial-gradient(ellipse at 50% 40%,var(--panel2),var(--panel));border:1px solid var(--line)}
.tree svg{display:block;width:100%;min-width:560px;height:auto}
.edge{stroke:var(--line2);stroke-width:3;fill:none}
.edge.on{stroke:var(--accent);stroke-width:4}
.node{cursor:pointer}
.node .shape{fill:var(--panel);stroke:var(--line2);stroke-width:2.5}
.node.on .shape{fill:var(--accent);stroke:var(--head)}
.node.sel .shape{stroke:var(--ember);stroke-width:4}
.node text{fill:var(--dim);font-family:var(--body);font-size:15px;text-anchor:middle;pointer-events:none;stroke:var(--panel);stroke-width:5px;paint-order:stroke;stroke-linejoin:round}
.node.on text{fill:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--dim)}

/* gems */
.setup{background:var(--panel);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.setup.off{border-style:dashed}
.sockets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sock{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);padding:3px 9px 3px 5px;border-radius:999px}
.sock::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--gem)}
.sock.main{border-color:var(--gem)}
.sock.main::before{box-shadow:0 0 0 2px var(--panel2),0 0 0 3px var(--gem)}
.sock.sup::before{background:var(--dim)}
.link{width:10px;height:2px;background:var(--accent)}

/* gear doll */
.gearwrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.gearwrap{grid-template-columns:minmax(0,1fr)}}
.doll{display:grid;gap:6px;grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-areas:"weapon helmet amulet offhand" "weapon body body offhand" "ring1 body body ring2" "gloves belt belt boots";
  background:var(--panel);border:1px solid var(--line);padding:10px}
.slot{min-width:0;min-height:86px;border:1px solid var(--line2);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;text-align:center}
.slot svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;flex:none}
.slot .nm{font-size:.8rem;line-height:1.15;overflow-wrap:anywhere}
.slot[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slot.empty{opacity:.4;border-style:dashed}
.r-normal{color:var(--normal)}.r-magic{color:var(--magic)}.r-rare{color:var(--rare)}.r-unique{color:var(--unique)}
.item{background:var(--panel);border:1px solid var(--line2);min-width:0}
.item header{padding:8px 12px;text-align:center;border-bottom:1px solid var(--line2);background:var(--panel2)}
.item header .n{font-family:var(--display);font-size:1.2rem}
.item .bd{padding:12px;display:flex;flex-direction:column;gap:10px}
.aff{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.aff>*{min-width:0}
.aff li{color:var(--magic)}
footer{border-top:1px solid var(--line);padding-block:14px;color:var(--dim);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.prog i,.node .shape,.edge{transition:all .2s}}
</style>

rials of Ascendancy"], "skip": ["Perpetus, Hatebeat, Captain Aurelianus, Shipyard Terror, Goddess of Purity, Kole, Fleshrend, Spinecrack, Tyrannursus, Thistlesage, Conqueror Wurm, Caliga, Paradisae Venenum, Trinian and A Swig of Hope"], "lab": "Trials 4 to 6 of 6: The Crematorium, The Catacombs, The Imperial Gardens. Then run the Normal Labyrinth."}, {"act": 4, "levels": "Levels 33 to 40", "mandatory": ["Voll (Deshret's Banner opens the Mines)", "Kaom and King Kaom (Eye of Fury)", "Daresso and the Grand Arena (Eye of Desire)", "Belly of the Beast", "Piety, the Abomination", "The Harvest (Maligaro, Shavronne, Doedre for Malachai's organs)", "Malachai"], "worth": ["Breaking the Seal, The King of Desire, The Eternal Nightmare: skill gem rewards", "An Indomitable Spirit: a passive point and 2 respec points"], "skip": ["Hundred Foot Shadow, Pikerivet, Hammerstorm, Voidscream, Torchoak Grove, Triskeriaki, Eyepecker, Steelchaw, The Bone Queen, The Burning Man and The White Death"]}, {"act": 5, "levels": "Levels 40 to 45", "mandatory": ["Overseer Krow (Return to Oriath)", "Justicar Casticus (Eyes of Zeal)", "High Templar Avarius and Innocence", "The Ossuary (The Ravenous God)", "Kitava"], "worth": ["In Service to Science: a passive point", "Kitava's Torments: a passive point and 2 respec points", "Death to Purity and The King's Feast: jewel rewards"], "skip": ["The Matriarch, Cato, The Risen Matriarch, Utula (optional kill, but gives a jewel choice) and the Stately Hideout"]}, {"act": 6, "levels": "Levels 45 to 52", "mandatory": ["Karui Fortress and Tukohama (The Father of War)", "Shavronne's Tower and Brutus (Essence of Umbra)", "Brine King's Reef and Tsoagoth"], "worth": ["Fallen from Grace: 2 respec points and unlocks Lilly Roth's gem shop", "The Father of War, The Cloven One, The Puppet Mistress: a passive point each", "Lord's Labyrinth: the Cruel Trial in the Lower Prison"], "skip": ["Rhys of Abram (except for the Fallen from Grace reward), Raihara, Riptide, Dishonoured Queen (except for the Eye of Conquest), Fleetfreak, Defiled Proclamation, The Animal Pack, Hollowskull and Brinecrack"], "lab": "Cruel trial 1 of 3: Lower Prison"}, {"act": 7, "levels": "Levels 52 to 58", "mandatory": ["Greust (route to the Northern Forest)", "Gruthkul (Lighting the Way, route to the Causeway)", "Arakaali (final boss)", "The Temple of Decay path through Yeena"], "worth": ["The Master of a Million Faces, Queen of Despair and Kishara's Star: a passive point each (Kishara's Star also gives 2 respec points)", "Lord's Labyrinth: two Cruel Trials"], "skip": ["Bundle of Woe, Plague Retch, Tunnelworm, The Dreadstone, The Bone Sculptor, The Great White Bones and Blightblade. Maligaro's Sanctum is not skippable: it drops the Black Venom for the Chamber of Sins Level 2 key."], "lab": "Cruel trials 2 and 3 of 3: The Crypt Level 1 and Chamber of Sins Level 2. Then run the Cruel Labyrinth."}, {"act": 8, "levels": "Levels 58 to 63", "mandatory": ["Doedre the Vile (Essence of the Hag)", "Tolman and the Quay", "Dawn (Solar Eclipse, Sun Orb) and Dusk (Lunar Eclipse, Moon Orb)", "Solaris and Lunaris (final boss)"], "worth": ["Love is Dead: a passive point and 2 respec points", "The Gemling Legion and Reflection of Terror: a passive point each", "Lord's Labyrinth: the Merciless Trial in the Bath House"], "skip": ["Lingering Abberation, Effigy of Fear, Ondar, Regulus, Nightbringer Lucius and the Solaris Concourse"], "lab": "Merciless trial 1 of 3: The Bath House"}, {"act": 9, "levels": "Levels 63 to 67", "mandatory": ["The Storm Blade and Bottled Storm (opens the Oasis)", "Shakari (Queen of the Sands)", "Garukhan and Kira (The Ruler of Highgate)", "General Adus (Trarthan Powder)", "Doedre Darksoul, Maligaro the Broken and Shavronne Unbound", "The Depraved Trinity (final boss)"], "worth": ["Queen of the Sands and The Ruler of Highgate: a passive point each", "Fastis Fortuna: 2 respec points", "Lord's Labyrinth: the Merciless Trial in the Tunnels"], "skip": ["Hundred Foot Shadow, Boulderback, Droolmaw, the Basilisk, the Forbidden Vault and the Desert Hideout"], "lab": "Merciless trial 2 of 3: The Tunnels"}, {"act": 10, "levels": "Levels 67 to 70", "mandatory": ["Plaguewing (frees Bannon)", "The Torched Courts and Innocence route", "Vilenta"], "worth": ["Vilenta's Vengeance: a passive point", "Safe Passage and An End to Hunger: quest rewards", "Lord's Labyrinth: the Merciless Trial in the Ossuary"], "skip": ["The Reliquary. The source I used ended after Vilenta, so check the rest of Act 10 in game."], "lab": "Merciless trial 3 of 3: The Ossuary, then run the Merciless Labyrinth before the Act 10 boss."}], "campaign_note": "Act ranges are approximate and match the area levels you will see. Mandatory means required to progress or to open the next area. The lists come from community campaign references that may date from 2023, so check any act that looks different in game. Passive point rewards add up over the campaign; resistances take a -30% penalty after Act 5 and again after Act 10.", "gem_sources": {"intro": "Ice Shot and its first supports come from Act 1 vendors and quests. Nessa in Act 1, Yeena in Act 2, Clarissa in Act 3 and Petarus and Vanja in Act 4 are the shops.", "rows": [{"gem": "Spectral Throw", "act": 1, "source": "Starting gem", "level": "Level 1", "conf": "Confirmed"}, {"gem": "Ice Shot", "act": 1, "source": "Enemy at the Gate, Nessa (vendor)", "level": "Level 2", "conf": "Confirmed"}, {"gem": "Frostblink", "act": 1, "source": "Breaking Some Eggs, quest reward", "level": "Level 4", "conf": "Confirmed"}, {"gem": "Mirage Archer Support", "act": 1, "source": "Mercy Mission, Nessa (vendor)", "level": "Level 4", "conf": "Confirmed"}, {"gem": "Added Cold Damage Support", "act": 1, "source": "The Caged Brute, quest reward", "level": "Level 8", "conf": "Confirmed"}, {"gem": "Added Lightning Damage Support", "act": 1, "source": "The Caged Brute, quest reward", "level": "Level 8", "conf": "Confirmed"}, {"gem": "Faster Attacks Support", "act": 2, "source": "Sharp and Cruel, Yeena (vendor)", "level": "Level 16", "conf": "Confirmed"}, {"gem": "Herald of Thunder", "act": 2, "source": "Intruders in Black, quest reward", "level": "Level 16", "conf": "Confirmed"}, {"gem": "Elemental Damage with Attacks Support", "act": 2, "source": "Sharp and Cruel, Yeena (vendor)", "level": "Level 18", "conf": "Confirmed"}, {"gem": "Vicious Projectiles Support", "act": 2, "source": "Sharp and Cruel, Yeena (vendor)", "level": "Level 18", "conf": "Confirmed"}, {"gem": "Tornado Shot", "act": 3, "source": "Sever the Right Hand, quest reward", "level": "Level 28", "conf": "Confirmed"}, {"gem": "Lightning Penetration Support", "act": 3, "source": "A Fixture of Fate, Clarissa (vendor)", "level": "Level 31", "conf": "Confirmed"}, {"gem": "Greater Volley Support", "act": 4, "source": "The Eternal Nightmare, Petarus and Vanja (vendor)", "level": "Level 38", "conf": "Confirmed"}], "note": "Anything you miss can be bought from Lilly Roth in the Act 6 town."}, "sources": [{"title": "Reliquarian: every notable and how it works", "url": "https://senseos.gg/guides/path-of-exile/reliquarian-ascendancy/", "site": "SenseOS", "note": "Ring layout, point costs, the list of borrowed powers; cross-checked against the 3.30 tree export."}, {"title": "PoE 3.30 Reliquarian Guide: League Start and Uniques", "url": "https://www.mmoso.com/news/poe-reliquarian-guide", "site": "MMOSO", "note": "Lab order, Death's Door and Crustacean's Call league-start picks; the article's own table disagrees with its text on how many effects exist."}, {"title": "PoE 3.30 Reliquarian Skills, Uniques and Best Builds", "url": "https://www.aoeah.com/news/4934--poe-330-reliquarian-skills-uniques--best-builds-leveling--endgame", "site": "AOEAH", "note": "Names a fork bow build with Rigwald's Quills (Lightning Arrow, Tornado Shot, Ice Shot) as one option."}, {"title": "Path of Exile gem and unique item data", "url": "https://poedb.tw/us/Tornado_Shot", "site": "poedb", "note": "Gem text, requirements, quest and vendor class eligibility, unique item text."}, {"title": "Ascendant Kinetic Fusillade Totem league starter", "url": "https://mobalytics.gg/poe/builds/ascendant-kf-totem-league-starter", "site": "Mobalytics", "note": "Read for Scion leveling ideas; written for 3.28 and not used for this build."}, {"title": "PoE Vault builds", "url": "https://www.poe-vault.com/", "site": "PoE Vault", "note": "Checked first; its 3.30 league-start list has no Scion build."}], "confidence_notes": ["I wrote this build myself; no author has published this exact setup, and only the tree and ring have been tested in Path of Building, not damage. The grades are about how the skills work and what they cost, not measured damage.", "The Reliquarian is new in 3.30. The tree export shows the ring: Reliquarian start, two Passive Point nodes, the Armour Display with five borrowed powers, a path of two more Passive Point nodes to the Martial Weapon Display, and one Passive Point node to the Jewellery Display. A SenseOS write-up says each Display costs one Ascendancy point and gives one borrowed power; the pick order here follows that reading and the eight Labyrinth points exactly cover five Passive Point nodes and three Displays. Confirm at the Labyrinth altar that the borrowed power does not cost an extra point.", "MMOSO says the caster and martial clusters cannot both be taken; the tree ring shows you can reach the Martial and Jewellery Displays without the Caster Display, which is the route used here.", "How Fork behaves with the piercing first arrow of Tornado Shot is unverified. The build does not rely on it; the 3 secondary projectiles are the ones that should fork.", "Lioneye's Glare needs 212 Dexterity and level 66; I did not price it or check that the route reaches that Dexterity.", "Tornado Shot (Act 3, level 28) is a Scion quest reward on poedb. Lightning Arrow is not on the Scion's vendor list, which is why it is not used.", "Levels for tree nodes are estimates from one point per level plus quest points, not counting the five Reliquarian Passive Point nodes.", "The resistance penalty after Act 5 and Act 10 and Labyrinth timing are standard campaign facts; campaign act lists were reused from earlier rounds and may date from 2023.", "Tested in Path of Building 2.68.1 on the 3.30 tree on 20 Nov 2026: the code imports, the Reliquarian ring shows 8 of 8 ascendancy points with the three borrowed powers included, and Movement Speed reads +42% (17% from the tree plus 25% from Death's Door), so the power is applied. With no items equipped, Dexterity was 190, Strength 100 and Intelligence 85; Herald of Thunder at gem level 20 asks for 155 Intelligence, so run it at a lower gem level or add Intelligence before relying on it. Damage numbers need a bow and have not been tested.", "Path of Building bow test on 20 Nov 2026 (build with generic evasion gear templates, no gloves, jewellery or flasks, all gems level 20): a +3 Thicket Bow gave 923 Combined DPS at 46% Hit Chance; Lioneye's Glare gave 4,006 at 100% Hit Chance and 3.09 attacks per second. With Glare, turning off Natural Hierarchy gave 3,503, and Praxis instead of Natural Hierarchy kept 3,503 while cutting Tornado Shot's mana cost from 43 to 21 and cost per second from 66 to 32 against 57 regeneration per second (33 without Praxis). Turning off Rigwald's Quills changed nothing in Single Projectile mode, which does not model forking well, so its value for packs is unmeasured.", "Same test, Inspiration Support in place of Faster Attacks (Praxis on, Glare equipped): Combined DPS 3,141 against 3,503, attack rate 2.32 against 3.09, crit chance 9.6% against 7.6%, mana cost 13 against 21. Faster Attacks stays in the 6-link; Inspiration is the swap if you add mana-hungry gems such as Wrath.", "Path of Building also reported 224 Dexterity required against 190, from some item in the test gear that I did not identify (it did not change with the bow), and 155 Intelligence required against 85, which I believe is Herald of Thunder at level 20. Resistances were negative because no resistance gear was worn, so the test is not a defence check.", "The Path of Building import code holds the route in four stages (level 33, 55, 68 and 75 and up) with the Reliquarian ring and the gem groups, but no items. The node list in the Passive Tree tab is the reference.", "Passive Tree tab map: node positions are computed from the 3.30 tree export (group position plus orbit), drawn with straight lines where the game draws short arcs.", "Early game checked for class access, gem level requirements and socket limits by item level. The level at which each Act 1 quest finishes is an estimate.", "Trial of Ascendancy detours sit at the area level of the area that holds the trial (Normal: Lower Prison 8, Chamber of Sins Level 2 16, Crypt Level 1 17, Crematorium 25, Catacombs 27, Imperial Gardens 30; Cruel: Prison 47, Crypt 51, Chamber of Sins Level 2 52; Merciless: Bath House 57, Tunnel 62, Ossuary 67). The bandit quest level is an estimate."], "loot_filter": {"influenced": [], "cluster_jewels": [], "leveling_area_max": 67, "es_only_armour": false, "extra_gems": ["Frostblink", "Flame Dash", "Herald of Thunder", "Faster Attacks", "Elemental Damage with Attacks", "Added Cold Damage", "Added Lightning Damage", "Greater Volley", "Lightning Penetration", "Vicious Projectiles", "Mirage Archer", "Wrath"], "drop_gems": [], "weapon_class": "Bows"}, "level_guide": [{"level": 1, "gems": ["Start with {g:Spectral Throw}. After Enemy at the Gate buy {g:Ice Shot} from Nessa; it needs a bow."], "gear": ["Pick up any bow; look out for {u:Goldrim} and {u:Tabula Rasa}. Up to 3 sockets until you find item level 25 gear (late Act 2 or Act 3)."]}, {"level": 2, "gems": [], "gear": [], "passives": ["Walk to, in this order: {k:Path of the Hunter} (about level 5); {k:Harrier} (about level 9); {k:Sentinel} (about level 13). Take the small nodes on each path."]}, {"level": 4, "gems": ["Take {g:Frostblink} from Breaking Some Eggs and buy {g:Mirage Archer Support} from Nessa; link it to {g:Ice Shot}."], "gear": []}, {"level": 8, "gems": ["Take {g:Added Cold Damage Support} and {g:Added Lightning Damage Support} from The Caged Brute; link the cold one to {g:Ice Shot}."], "gear": [], "detour": ["Act 1: take the Trial of Ascendancy in the Lower Prison (area level 8). You need all six Normal trials, so take each one as you pass it."]}, {"level": 16, "gems": ["Take {g:Herald of Thunder} (Intruders in Black, Act 2) and buy {g:Faster Attacks Support} from Yeena."], "gear": ["Fix any missing resistances; keep a Life flask running."], "detour": ["Act 2: take the Trial of Ascendancy in the Chamber of Sins Level 2 (area level 16)."]}, {"level": 17, "gems": [], "gear": [], "detour": ["Act 2: take the Trial of Ascendancy in the Crypt Level 1 (area level 17)."]}, {"level": 18, "gems": ["Buy {g:Elemental Damage with Attacks Support} from Yeena after Sharp and Cruel."], "gear": [], "passives": ["Walk to {k:Ash, Frost and Storm} (about level 20) and {k:Constitution} (about level 23)."]}, {"level": 22, "gems": [], "gear": [], "detour": ["Act 2: kill all three bandits (Oak, Kraityn and Alira) for 2 passive points."]}, {"level": 25, "gems": [], "gear": [], "detour": ["Act 3: take the Trial of Ascendancy in the Crematorium (area level 25)."]}, {"level": 27, "gems": [], "gear": [], "detour": ["Act 3: take the Trial of Ascendancy in the Catacombs, the side area at the Marketplace (area level 27)."]}, {"level": 28, "gems": ["Take {g:Tornado Shot} from Sever the Right Hand (Act 3) and move your supports onto it. Level 28 is required."], "gear": ["Put on {u:Tabula Rasa} if it dropped: six linked white sockets."], "passives": ["Walk to {k:Ballistics} (about level 28) and {k:Aspect of the Eagle} (about level 30)."]}, {"level": 30, "gems": [], "gear": [], "detour": ["Act 3: take the Trial of Ascendancy in the Imperial Gardens (area level 30). With all six trials held, the Aspirants' Plaza in the Sarn Encampment opens the Normal Labyrinth."]}, {"level": 33, "gems": [], "gear": [], "detour": ["DIVERT TO THE NORMAL LABYRINTH: collect all six trials first. Take the two Passive Point nodes of the {k:Reliquarian} ring."]}, {"level": 38, "gems": ["Take {g:Greater Volley Support} from The Eternal Nightmare (Act 4) and link it to {g:Tornado Shot}."], "gear": [], "passives": ["Walk to {k:Avatar of the Hunt} (about level 36) and {k:Hired Killer} (about level 38)."]}, {"level": 47, "gems": [], "gear": [], "detour": ["Act 6: take the Cruel trial in the Prison (area level 47)."]}, {"level": 51, "gems": [], "gear": [], "detour": ["Act 7: take the Cruel trial in the Crypt (area level 51)."]}, {"level": 52, "gems": [], "gear": [], "detour": ["Act 7: take the Cruel trial in the Chamber of Sins Level 2 (area level 52)."]}, {"level": 55, "gems": [], "gear": ["Swap to rare boots with Movement Speed once {k:Death's Door} is in."], "detour": ["DIVERT TO THE CRUEL LABYRINTH at level 55 after the Act 6 and 7 trials: take the Armour Display and borrow {k:Death's Door}, plus one Passive Point node."]}, {"level": 57, "gems": [], "gear": [], "detour": ["Act 8: take the Merciless trial in the Bath House (area level 57)."]}, {"level": 62, "gems": [], "gear": [], "detour": ["Act 9: take the Merciless trial in the Tunnel (area level 62)."]}, {"level": 67, "gems": [], "gear": [], "detour": ["Act 10: take the Merciless trial in the Ossuary (area level 67), before the Act 10 boss. All three Merciless trials must be done before the lab opens."]}, {"level": 68, "gems": ["Keep Greater Volley; drop Faster Attacks only if you need a socket for Penetration."], "gear": ["Buy a 6-link body armour for the endgame links."], "detour": ["DIVERT TO THE MERCILESS LABYRINTH at level 68 after the Act 8 to 10 trials and before the Act 10 boss: take a Passive Point node, the Martial Weapon Display and borrow {k:Rigwald's Quills}."]}, {"level": 75, "gems": [], "gear": ["{u:Lioneye's Glare}: the biggest single upgrade in testing. Check you have 212 Dexterity; otherwise a rare bow with high physical damage and some accuracy."], "detour": ["DIVERT TO THE ETERNAL LABYRINTH at level 75: take the last Passive Point node, then the Jewellery Display and borrow {k:Praxis}. Your character needs an Offering to the Goddess to enter."]}, {"level": 90, "gems": ["Optional: {g:Wrath} for extra lightning damage, only after checking reservation in Path of Building."], "gear": ["Rare bow with physical damage and attack speed; upgrade jewels for Life and Dexterity."]}], "pob_code": "eJztV9tu3DYQ_RWCTy4wjXm_AKsNXMd2AthumnXTx4KWZncFU5QjUU7894G0u1jbLfoWxwX8Ro3mckZzSB7N3n5rIrnDrq_bVFD-hlGCqWyrOq0K-ufV6a-Ovp3PPoa8_n3521DH8cV8Nq1IxDuMBeWMUZJDt8L8eZdI_s0ouQ6pqnNBL9uElJQx9P1laLCgi7JuEyWhLzFVx3v7J4z1lyF0dUiUNKFOi7a8wXzWtcNtQTkldzV-vWgrLOjVp5MTOp8dTkjms8s2Yz-_arsUqpYs1m0mD5KRrh0yAsE-103IuIXev5kdbgJnVx0iCWWu73Bxi2VBFZ3PxhXJdY5Y0PMxgEhJDi7brgmRxHD9CyWprbAvqHZOSuCaKwVSc-vBM-aBe80MeO5AOCE4CGWUBCm10mAEZxKkt1aCktwIEJILAdyPSQTXHKQ1noFySkgwgikw0lsDUirrQVnJBWjtjAGlJbcgnJQMlNHWAZeWK9BaOQ3CaatAc-sMCKW8Aemd4aC8tw6Mlg6kM0aAZlI6UMIbBUYLoYAbbixw5oQHIR1wrrwFrZgDzjhzILWXBoRQim8n_KEqKHs029EiKOmxbFMVuvujx6_YOOo-Y3d_slximfuCUpI7xAdkkmzMPoxe70O_Ph1HsCebGIkwDuvfRqY1OTjuBnydmJcMhGfOgzJybNsYZ8FwZzVwL5wF5aX1IJmVEpTn1oGS0iqQnDkGyisuQCjpJBjLJyATEdTYsxWag5XOgWHSO5DeKAfcuvEr8rHPfzAGpFHOAzfeK9CCefVCOWQcObjArqwj9v0rj14-j8Aw7QRwwZgEZZl2L5RZVpOQKjLckoOTjF16vVj-n_QCL_QU5DwIa14G3Q5HVTOfLW7qGPuduhkfFpgnOVXhMgwxn2HzxxBine8nAHvr-UbgpUnxXIRvdTM0dJtwgZnU1ZhmayCYwnXEqqC5G5COPB6DKalTGYcKP6TTIcZ3Hxc7h1HgHe1BTYie2I5DLPtNjTNsSArNVp49VHqUfNmhF5N8fQSjbIe06XYrV_c-Z7G9DpHvPB8aRUGXIfZID59Wvqi7sEJy1JVr7B6U_vGVzzoMGTvyuY0R75-19FFVYUXO69U6pzqtyLvQhBU-K4STiA2mHOK2OPla5zU5yjmUN_2zIjmdNugzlT6c9sHP2GLvsQuxIu2SXK2HVD0i-w_ZZz-v1dOu7fN1rNPNc_V4uDtDd8t-PvuQsdkd0-N6d0oPPS6m6-IvDLdtmsybhJuY_Un8H65j7anAfHbcpmW9Gg1Pfuu_A-pglZ0="}</script>
<script>
(function(){
"use strict";
var B=JSON.parse(document.getElementById("build-data").textContent);
var M=B.meta||{}, MAX=M.max_level||100, KEY="wa:"+(M.slug||M.title||"build");
var S={level:1,done:{},nodes:{},stage:null,slot:null,node:null,wset:1,future:true};
try{var sv=JSON.parse(localStorage.getItem(KEY)||"null"); if(sv){S.level=sv.level||1;S.done=sv.done||{};S.nodes=sv.nodes||{};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({level:S.level,done:S.done,nodes:S.nodes}));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
/* {g:Gem} {u:Unique} {r:Rare} {m:Magic} {k:Keystone/Notable} {c:Currency} */
function fmt(s){return esc(s).replace(/\{([gurmkc]):([^}]+)\}/g,'<span class="t-$1">$2</span>');}
function list(a,cls){return a&&a.length?'<ul class="plain '+(cls||"")+'">'+a.map(function(x){return"<li>"+fmt(x)+"</li>";}).join("")+"</ul>":"";}
function box(title,inner){return inner?'<section class="box">'+(title?"<h3>"+esc(title)+"</h3>":"")+inner+"</section>":"";}

/* ---------- level by level (WraeclastArchitect extras) ---------- */
function lgEvents(){
  var ev={};
  function at(l){l=Math.max(1,l|0);return ev[l]=ev[l]||{gems:[],gear:[],detour:[],passives:[]};}
  function add(l,k,t){at(l)[k].push(t);}
  var G=B.level_guide||[];
  if(G.length){
    G.forEach(function(e){["gems","gear","detour","passives"].forEach(function(k){(e[k]||[]).forEach(function(t){add(e.level,k,t);});});if(e.respec)at(e.level).respec=e.respec;});
  }else{
    ((B.gems&&B.gems.setups)||[]).forEach(function(s){
      var sup=(s.supports||[]).map(function(x){return x.name;}).join(", ");
      add(s.from_level||1,"gems","Start {g:"+s.skill+"}"+(sup?" linked with "+sup:""));
      if(s.to_level)add(s.to_level+1,"gems","Retire {g:"+s.skill+"} ("+s.name+")");
    });
    stages().forEach(function(st,i){if(i>0)add(st.from_level||1,"gear","Move to the "+st.name+" gear stage (Gear tab)");});
    (B.progression||[]).forEach(function(p){if(p.type==="gem"||p.type==="gear")add(p.level,p.type==="gem"?"gems":"gear",p.title+(p.detail?": "+p.detail:""));});
  }
  return ev;
}
function ul(a){return"<ul>"+a.map(function(x){return"<li>"+fmt(x)+"</li>";}).join("")+"</ul>";}

  var L=function(t,a,c){return a&&a.length?'<h4 class="'+c+'">'+t+"</h4>"+ul(a):"";};
  C.forEach(function(a){
    var n=a.levels.match(/\d+/g).map(Number),here=S.level>=n[0]&&S.level<=n[n.length-1];
    h+='<section class="box act'+(here?" here":"")+'"><h3>Act '+a.act+' <span class="muted">'+esc(a.levels)+"</span></h3>"+
      (a.lab?'<p class="labnote"><b>Ascendancy:</b> '+fmt(a.lab)+"</p>":"")+
      L("Mandatory",a.mandatory,"m")+L("Worth doing",a.worth,"w")+L("Skip",a.skip,"s")+"</section>";

P.levels=function(){
  var ev=lgEvents(),lv=Object.keys(ev).map(Number).sort(function(a,b){return a-b;});
  var h="<h2>Leveling, level by level</h2>"+'<p class="muted">What to do with your gems and your gear at each point of the climb. Move the level slider and the row for your level is marked. Levels are approximate, treat them as guidelines.</p>';
  if(!lv.length)return h+'<p class="muted">This build has no gem or gear steps.</p>';
  var cur=0;lv.forEach(function(l){if(l<=S.level)cur=l;});
  var rows=lv.map(function(l,i){
    var end=(lv[i+1]||MAX+1)-1,e=ev[l],here=l===cur,later=l>S.level;
    var pcell=function(e){var h=e.passives.length?ul(e.passives):"";
      var r=e.respec;if(r){var li=function(t,a){return a&&a.length?"<p><b>"+t+"</b></p>"+ul(a):"";};
        h+='<div class="respec"><b>RESPEC</b>'+(r.when?"<p>"+fmt(r.when)+"</p>":"")+li("Remove",r.remove)+(r.gold?"<p><b>Gold:</b> "+fmt(r.gold)+"</p>":"")+li("Then take",r.then)+(r.note?'<p class="muted">'+fmt(r.note)+"</p>":"")+"</div>";}
      return h||'<span class="muted">No passive change.</span>';};
    var dcell=function(a){return a&&a.length?"<ul>"+a.map(function(x){return"<li"+(/^[A-Z ]{6,}[:A-Z]/.test(x)?' class="lab"':"")+">"+fmt(x)+"</li>";}).join("")+"</ul>":'<span class="muted">Just keep going.</span>';};
    var cell=function(a){return a.length?ul(a):'<span class="muted">Keep what you have.</span>';};
    return'<tr class="'+(here?"here":later?"later":"")+'"><td>'+(end>l?l+" to "+end:l)+(here?'<span class="now">you are here</span>':"")+"</td><td>"+cell(e.gems)+"</td><td>"+cell(e.gear)+"</td><td>"+pcell(e)+"</td><td>"+dcell(e.detour)+"</td></tr>";
  }).join("");
  return h+'<div class="scroll"><table class="lg"><thead><tr><th>Level</th><th>Gems</th><th>Gear</th><th>Passive tree</th><th>Detours and quests</th></tr></thead><tbody>'+rows+"</tbody></table></div>"+campaignHtml();
};

    var fb=function(){if(ta){ta.select();try{document.execCommand("copy");ok();}catch(x){}}};
    try{navigator.clipboard.writeText(lfText()).then(ok,fb);}catch(x){fb();}
  }
});

/* ---------- routing and events ---------- */
function tab(){var t=location.hash.replace("#","");return P[t]?t:"overview";}
function render(){
  var t=tab();
  document.getElementById("tabs").innerHTML=TABS.map(function(x){return'<a href="#'+x[0]+'"'+(x[0]===t?' aria-current="page"':"")+">"+x[1]+"</a>";}).join("");
  document.getElementById("page").innerHTML=P[t]();
}
window.addEventListener("hashchange",function(){render();
  /* land on the new tab's content, just under the sticky bar, so a tap visibly changes the screen on phones */
  var bar=document.querySelector(".bar"),pg=document.getElementById("page");
  var y=pg?pg.getBoundingClientRect().top+window.pageYOffset-(bar?bar.offsetHeight:0)-4:0;
  window.scrollTo(0,Math.max(0,Math.round(y)));});
var page=document.getElementById("page");
page.addEventListener("change",function(e){var id=e.target.getAttribute("data-step");if(id){if(e.target.checked)S.done[id]=1;else delete S.done[id];save();render();}});
function act(el){
  var d=el.closest("[data-act],[data-stage],[data-wset],[data-slot],[data-node]");if(!d)return;
  if(d.dataset.node){S.node=d.dataset.node;}
  else if(d.dataset.slot){S.slot=d.dataset.slot;}
  else if(d.dataset.stage){S.stage=d.dataset.stage;S.slot=null;}
  else if(d.dataset.wset){S.wset=+d.dataset.wset;}
  else if(d.dataset.act==="future"){S.future=!S.future;}
  else if(d.dataset.act==="reset"){S.done={};save();}
  else if(d.dataset.act==="tree-reset"){S.nodes={};save();}
  else if(d.dataset.act==="node-toggle"){var n=(B.tree.nodes||[]).filter(function(x){return x.id===S.node;})[0];if(n){S.nodes[n.id]=!nodeOn(n);save();}}
  render();
}
page.addEventListener("click",function(e){act(e.target);});
page.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.closest(".node")){e.preventDefault();act(e.target);}});
(B.progression||[]).forEach(function(s,i){if(!s.id)s.id="s"+i;});
paintLevel();render();
})();
</script>
